[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "willow-read"
version = "0.1.0"
description = "The one sanctioned KB-read seam for hosted apps: read the Willow KB only through an injected, app-scoped knowledge_search client — no raw shared-store reads (box audit A5/B3). Stdlib-only, egress-free."
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
