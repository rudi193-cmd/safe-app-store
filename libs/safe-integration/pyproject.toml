[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-integration"
version = "0.1.0"
description = "Protocol interfaces for SAFE app integration: intake staging, consent session lifecycle, user identity, and KB query. Each contract is opt-in — apps import only the Protocols they use."
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
