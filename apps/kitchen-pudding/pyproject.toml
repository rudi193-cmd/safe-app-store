[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kitchen-pudding"
version = "0.1.0"
description = "Local-first recipe store where every ingredient carries provenance — measured, fitted, or assumed."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[tool.setuptools.packages.find]
include = ["kitchen_pudding*"]
