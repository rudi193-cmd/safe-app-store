[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-app-private-ledger"
version = "0.1.2"
description = "Local personal budgeting companion — fully private, no cloud sync, paired with Public Ledger."
requires-python = ">=3.10"
dependencies = [
    "textual>=0.52.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# The shared no-egress checker (convention #13). Pinned to the branch until
# safe-app-common cuts a tag/release; repin then. Installed for tests via
# `pip install -e .[test]`.
test = [
    "safe-app-common @ git+https://github.com/rudi193-cmd/safe-app-common-package@master",
]

[project.scripts]
private-ledger = "private_ledger.app:main"

[tool.setuptools.packages.find]
where = ["src"]
