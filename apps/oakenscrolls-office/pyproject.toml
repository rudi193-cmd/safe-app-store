[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oakenscrolls-office"
version = "0.2.0"
description = "Personal calibration ledger — where certainty gets graded. Local-first, append-only, no egress."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "textual>=0.47.0",
]

[project.optional-dependencies]
# Shared no-egress checker (convention #13). Branch-pinned until a tag.
test = [
    "safe-app-common @ git+https://github.com/rudi193-cmd/safe-app-common-package@master",
]

[project.scripts]
oakenscrolls-office = "app:main"
