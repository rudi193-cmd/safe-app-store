[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-app-genealogy"
version = "1.0.0"
description = "The Aionic Genealogy Project — family tree research powered by FamilySearch, public records, and the Paperclip genealogy DB."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "requests>=2.28.0",
]
