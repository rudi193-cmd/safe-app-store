<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semantic Translator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container { max-width: 860px; margin: 0 auto; }
    header { margin-bottom: 2rem; }
    header h1 { font-size: 1.6rem; font-weight: 700; color: #7dd3fc; }
    header p  { font-size: 0.9rem; color: #94a3b8; margin-top: 0.25rem; }

    .search-bar {
      display: flex; gap: 0.5rem; margin-bottom: 1rem;
    }
    .search-bar input {
      flex: 1;
      padding: 0.65rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 1rem;
    }
    .search-bar input:focus { outline: none; border-color: #7dd3fc; }
    .search-bar button {
      padding: 0.65rem 1.4rem;
      border-radius: 0.5rem;
      border: none;
      background: #0ea5e9;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
    }
    .search-bar button:hover { background: #38bdf8; }
    .search-bar button:disabled { opacity: 0.5; cursor: default; }

    .controls {
      display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem;
      font-size: 0.85rem; color: #94a3b8;
    }
    .controls label { display: flex; align-items: center; gap: 0.35rem; }
    .controls input[type=range] { width: 80px; }

    #stats {
      font-size: 0.8rem; color: #64748b; margin-bottom: 1.5rem;
    }

    #results { display: flex; flex-direction: column; gap: 0.75rem; }

    .result-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.5rem;
      padding: 1rem 1.2rem;
    }
    .result-card .meta {
      display: flex; align-items: center; gap: 0.75rem;
      font-size: 0.78rem; color: #94a3b8; margin-bottom: 0.5rem;
    }
    .result-card .lang-tag {
      padding: 0.1rem 0.5rem;
      border-radius: 9999px;
      font-weight: 700; font-size: 0.72rem;
      text-transform: uppercase;
    }
    .lang-en { background: #14532d; color: #86efac; }
    .lang-es { background: #713f12; color: #fde68a; }
    .result-card .content {
      font-size: 0.9rem; line-height: 1.6; white-space: pre-wrap;
      color: #cbd5e1;
    }
    .rank { color: #7dd3fc; font-weight: 700; }

    .empty { color: #64748b; text-align: center; padding: 3rem 0; }
    .error { color: #f87171; background: #1c0a0a; border: 1px solid #7f1d1d;
             border-radius: 0.5rem; padding: 0.75rem 1rem; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>Semantic Translator</h1>
    <p>Find meaning-matched translation segments from the lesson corpus.</p>
  </header>

  <div id="stats">Loading corpus stats…</div>

  <div class="search-bar">
    <input id="query" type="text" placeholder="Enter a concept, sentence, or phrase…" autofocus>
    <button id="search-btn" onclick="doSearch()">Search</button>
  </div>

  <div class="controls">
    <label>Results: <input type="range" id="limit" min="1" max="15" value="5">
      <span id="limit-val">5</span>
    </label>
  </div>

  <div id="results"><p class="empty">Enter text above to find semantically similar segments.</p></div>
</div>

<script>
  const limitSlider = document.getElementById('limit');
  const limitVal    = document.getElementById('limit-val');
  limitSlider.addEventListener('input', () => limitVal.textContent = limitSlider.value);

  document.getElementById('query').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
  });

  async function loadStats() {
    try {
      const r = await fetch('/corpus/stats');
      const d = await r.json();
      const langs = Object.entries(d.languages)
        .map(([k,v]) => `${k}: ${v}`)
        .join('  ·  ');
      document.getElementById('stats').textContent =
        `Corpus: ${d.segments.toLocaleString()} segments · ${d.lessons} lessons · ${langs}`;
    } catch {
      document.getElementById('stats').textContent = 'Corpus stats unavailable';
    }
  }

  async function doSearch() {
    const text  = document.getElementById('query').value.trim();
    const limit = parseInt(limitSlider.value);
    const btn   = document.getElementById('search-btn');
    const out   = document.getElementById('results');

    if (!text) return;
    btn.disabled = true;
    out.innerHTML = '<p class="empty">Searching…</p>';

    try {
      const r = await fetch('/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, limit }),
      });
      if (!r.ok) {
        const err = await r.json();
        out.innerHTML = `<p class="error">Error ${r.status}: ${err.detail}</p>`;
        return;
      }
      const data = await r.json();
      if (!data.results || data.results.length === 0) {
        out.innerHTML = '<p class="empty">No matches found.</p>';
        return;
      }
      out.innerHTML = data.results.map((res, i) => {
        const title   = res.title || '';
        const content = res.content || res.text || JSON.stringify(res);
        const score   = res.score ?? res.certainty ?? res.similarity ?? '?';
        const lang    = title.toLowerCase().includes('| es') ? 'es' : 'en';
        return `
          <div class="result-card">
            <div class="meta">
              <span class="rank">#${i+1}</span>
              <span class="lang-tag lang-${lang}">${lang}</span>
              <span>${escHtml(title)}</span>
              <span style="margin-left:auto">score: ${typeof score === 'number' ? score.toFixed(3) : score}</span>
            </div>
            <div class="content">${escHtml(content.slice(0, 600))}</div>
          </div>`;
      }).join('');
    } catch (e) {
      out.innerHTML = `<p class="error">Network error: ${e.message}</p>`;
    } finally {
      btn.disabled = false;
    }
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  loadStats();
</script>
</body>
</html>
