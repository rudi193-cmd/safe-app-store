<title>Die-Namic</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;1,7..72,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a games cupboard. Four shelves, each a row of board-game box lids standing on a wooden plank; every lid's art is a small live toy. Opening a box shows how to play it. One look on purpose: a lit cupboard in any room. */
:root {
  --wall: #183634;
  --wall-2: #1d3f3c;
  --wall-line: #20453f;
  --wood: #a8733f;
  --wood-dark: #6b4220;
  --wood-light: #c58e55;
  --chalk: #f4ecdc;
  --chalk-dim: #b9c8bf;
  --chalk-faint: #7f9a92;
  --sticker: #ffd34d;
  --sticker-ink: #3a2a00;
  --paper: #fbf5e8;
  --paper-ink: #2a2522;
  --paper-dim: #6e655e;
  --strong: #3fa67a;
  --weak: #e2a52f;
  --miss: #d65a43;
  --lid-font: "Bowlby One", "Arial Black", Impact, sans-serif;
  --ui: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --prose: "Literata", "Iowan Old Style", Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--wall);
  background-image: repeating-linear-gradient(90deg, transparent 0 46px, var(--wall-line) 46px 48px);
  color: var(--chalk);
  font-family: var(--ui);
  font-size: 16px;
  line-height: 1.5;
}
.wrap {
  max-width: 1240px; margin: 0 auto;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 40px;
}
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 3px solid var(--sticker); outline-offset: 3px; }

/* the sign over the cupboard */
.sign { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px 32px; }
.sign h1 { font-family: var(--lid-font); font-weight: 400; font-size: clamp(2.6rem, 7vw, 4.6rem); line-height: 0.95; margin: 0; letter-spacing: 0.01em; color: var(--chalk); text-shadow: 4px 4px 0 var(--wood-dark); }
.sign h1 span { color: var(--sticker); }
.sign p { margin: 8px 0 0; font-family: var(--prose); font-size: 1.15rem; color: var(--chalk-dim); max-width: 46ch; }
.jump { display: flex; flex-wrap: wrap; gap: 8px; }
.jump a { font-weight: 700; font-size: 0.9rem; color: var(--chalk); text-decoration: none; padding: 7px 14px; border-radius: 999px; border: 2px solid var(--wall-line); background: var(--wall-2); }
.jump a:hover { border-color: var(--sticker); }

/* shelves */
.shelf { display: grid; gap: 14px; scroll-margin-top: 16px; }
.shelf-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.shelf-head h2 { font-family: var(--lid-font); font-weight: 400; font-size: 1.35rem; margin: 0; letter-spacing: 0.02em; }
.shelf-head p { margin: 0; color: var(--chalk-faint); font-size: 0.95rem; }
.row {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(min(200px, calc(50% - 9px)), 1fr)); gap: 22px 18px;
  align-items: end; padding: 0 10px 0;
  position: relative;
}
.plank { height: 18px; margin-top: -4px; border-radius: 3px; background: linear-gradient(180deg, var(--wood-light), var(--wood) 35%, var(--wood-dark)); box-shadow: 0 14px 18px -10px #000a; }

/* a box lid */
.box {
  --lid: #c8442f; --ink: var(--chalk); --art: #0002;
  position: relative; aspect-ratio: 4 / 5; min-width: 0; container-type: inline-size;
  background: var(--lid); color: var(--ink);
  border-radius: 6px;
  box-shadow: 7px 7px 0 color-mix(in srgb, var(--lid) 55%, #000), 0 18px 26px -14px #000c;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px;
  padding: 12px;
  transition: transform .18s ease;
}
.box::before { content: ""; position: absolute; inset: 6px; border: 2px solid color-mix(in srgb, var(--ink) 40%, transparent); border-radius: 3px; pointer-events: none; }
.box:hover { transform: translateY(-5px) rotate(-0.6deg); }
@media (prefers-reduced-motion: reduce) { .box, .box:hover { transition: none; transform: none; } }
.maker { font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.75; padding: 2px 4px 0; }
.art { position: relative; background: var(--art); border-radius: 4px; overflow: hidden; display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; }
.lid-foot { display: grid; gap: 2px; padding: 0 4px 2px; }
.lid-title { font-family: var(--lid-font); font-weight: 400; font-size: clamp(0.95rem, 10.5cqi, 1.45rem); line-height: 1; text-align: left; letter-spacing: 0.01em; }
.lid-line { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 8px; align-items: center; font-size: 0.72rem; font-weight: 700; opacity: 0.85; white-space: nowrap; }
.lid-open { font-weight: 800; font-size: 0.72rem; text-decoration: underline; text-underline-offset: 3px; }
.sticker {
  position: absolute; top: -12px; right: -10px; z-index: 2; width: 74px; height: 74px; border-radius: 50%;
  background: var(--sticker); color: var(--sticker-ink); display: grid; place-content: center; text-align: center;
  font-family: var(--ui); font-weight: 800; font-size: 0.6rem; line-height: 1.05; text-transform: uppercase; letter-spacing: 0.02em;
  transform: rotate(12deg); box-shadow: 2px 3px 0 #0004;
}
.sticker b { display: block; font-size: 0.82rem; letter-spacing: 0; }

/* shared bits for the art */
.hint { display: block; padding: 0 6px 6px; text-align: center; font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.7; pointer-events: none; }
.toy { width: 100%; height: 100%; min-height: 0; display: grid; place-items: center; place-content: center; cursor: pointer; padding: 8px; overflow: hidden; }
.die { width: 42px; height: 42px; border-radius: 9px; background: #fffaf0; box-shadow: inset 0 -3px 0 #d9ccb4, 0 4px 8px -4px #000; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 7px; }
.die b { width: 7px; height: 7px; border-radius: 50%; background: #2a1f22; place-self: center; visibility: hidden; }
.die b.on { visibility: visible; }
.die.dim { opacity: 0.35; }
.dice { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.spin { animation: spin .5s cubic-bezier(.3,.7,.4,1); }
@keyframes spin { 0% { transform: translateY(-10px) rotate(-180deg) scale(.8); } 100% { transform: none; } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
.big { font-family: var(--lid-font); font-size: 1.6rem; line-height: 1; }
.cap { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; }
.stack { display: grid; gap: 8px; justify-items: center; text-align: center; }
.card {
  width: 46px; height: 66px; border-radius: 5px; background: #fffaf0; color: #222; box-shadow: 0 3px 6px -2px #0008;
  display: grid; place-items: center; font-family: var(--ui); font-weight: 800; font-size: 1.05rem; line-height: 1;
  border: 1px solid #0002;
}
.card.red { color: #c0392b; }
.fan { display: flex; justify-content: center; }
.fan .card { margin-left: -14px; transform-origin: 50% 120%; }
.fan .card:first-child { margin-left: 0; }
.phrase { font-family: var(--prose); font-size: 0.98rem; line-height: 1.35; text-align: center; padding: 0 6px; }
.phrase i { opacity: 0.85; }
.blank { display: inline-block; min-width: 4.5ch; border-bottom: 2px solid currentColor; text-align: center; font-weight: 700; }
input.name { font: inherit; font-family: var(--ui); font-weight: 700; font-size: 0.9rem; width: 80%; padding: 5px 8px; border-radius: 6px; border: 2px solid #0003; background: #fffaf0; color: #222; text-align: center; }

/* inside the box */
dialog {
  border: 0; padding: 0; border-radius: 10px; width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
  background: var(--paper); color: var(--paper-ink); box-shadow: 0 30px 60px -20px #000;
}
dialog::backdrop { background: #08141399; }
.inside { display: grid; gap: 16px; padding: 22px 22px 24px; font-family: var(--prose); }
.inside-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.inside h3 { font-family: var(--lid-font); font-weight: 400; font-size: 2rem; line-height: 1; margin: 0; }
.inside .add-on { font-family: var(--mono); font-size: 0.72rem; color: var(--paper-dim); margin-top: 6px; }
.close { font-family: var(--ui); font-weight: 800; font-size: 1.4rem; line-height: 1; padding: 4px 10px; border-radius: 6px; color: var(--paper-ink); }
.close:hover { background: #0001; }
.inside .lede { font-size: 1.15rem; margin: 0; }
.inside h4 { font-family: var(--ui); font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--paper-dim); margin: 0 0 6px; }
.inside p { margin: 0; }
.cmds { position: relative; background: #2a2522; color: #f4ecdc; border-radius: 8px; padding: 12px 14px; overflow-x: auto; font-family: var(--mono); font-size: 0.78rem; line-height: 1.7; }
.cmds pre { margin: 0; white-space: pre; }
.copy { position: sticky; float: right; left: 0; font-family: var(--ui); font-weight: 700; font-size: 0.75rem; padding: 3px 9px; border-radius: 6px; background: #f4ecdc22; color: #f4ecdc; }
.copy:hover { background: #f4ecdc44; }
.inside .note { font-size: 0.92rem; color: var(--paper-dim); }
.go { display: inline-block; font-family: var(--ui); font-weight: 800; text-decoration: none; background: #c8442f; color: #fff7ec; padding: 10px 18px; border-radius: 8px; }
.go:hover { background: #a93622; }
.inside a.card-link { color: #9b3a24; font-family: var(--ui); font-weight: 700; }

footer.foot { color: var(--chalk-faint); font-size: 0.85rem; max-width: 80ch; font-family: var(--prose); }
footer.foot code { font-family: var(--mono); font-size: 0.8rem; color: var(--chalk-dim); }
@media (max-width: 480px) { .row { padding: 0 4px; } .box { padding: 9px; gap: 6px; aspect-ratio: auto; } .art { height: 168px; } .lid-line { white-space: normal; } .maker { display: none; } .sticker { width: 60px; height: 60px; font-size: .5rem; } .sticker b { font-size: .7rem; } .toy { padding: 4px; } .art { overflow: hidden; } .fan .card { width: 34px; height: 50px; font-size: .8rem; margin-left: -10px; } .phrase { font-size: .82rem; } .cap, .hint { font-size: .55rem; } .die { width: 32px; height: 32px; padding: 5px; } .die b { width: 5px; height: 5px; } }
</style>

<div class="wrap">
  <header class="sign">
    <div>
      <h1>Die<span>·</span>Namic</h1>
      <p id="lede">A cupboard of games. Poke the lids, then open a box to play.</p>
    </div>
    <nav class="jump" id="jump" aria-label="Shelves"></nav>
  </header>
  <main id="shelves" style="display:grid;gap:44px"></main>
  <footer class="foot">The toys on the lids roll in your browser and keep nothing. The games themselves keep every move on your table's record: open a box for the line that plays it, run from the safe-app-store folder with <code>games/play.py</code>.</footer>
</div>

<dialog id="inside" aria-labelledby="inside-title"><div class="inside" id="inside-body"></div></dialog>

      const pts = hand.filter((c) => c[1] === "♥").length + 13;
      el.innerHTML = `<div class="toy stack"><div class="fan">${hand.map((c, i) => `<div class="card ${c[2] ? "red" : ""}" style="transform:rotate(${(i - 2) * 9}deg) translateY(${Math.abs(i - 2) * 4}px)">${c[0]}${c[1]}</div>`).join("")}</div>
        <div class="cap" style="margin-top:6px">${pts} points of danger in hand</div></div><span class="hint">tap to deal again</span>`;
    };
    el.addEventListener("click", deal); deal();
  },
  "play-crazy-eights"(el) {
    const suits = [["♠", 0], ["♥", 1], ["♦", 1], ["♣", 0]]; let s = 1;
    const draw = () => {
      el.innerHTML = `<div class="toy stack"><div style="display:flex;gap:10px;align-items:center"><div class="card" style="background:repeating-linear-gradient(45deg,#ff8a3d 0 4px,#fff2e6 4px 8px)"></div><div class="card ${suits[s][1] ? "red" : ""} ${reduced ? "" : "spin"}" style="font-size:1.3rem">8${suits[s][0]}</div></div>
        <div class="cap" style="margin-top:4px">eight is wild · now ${["spades", "hearts", "diamonds", "clubs"][s]}</div></div><span class="hint">tap to call a suit</span>`;
    };
    el.addEventListener("click", () => { s = (s + 1) % 4; draw(); }); draw();
  },
  "play-dice"(el) {
    let r = null;
    const draw = () => { el.innerHTML = `<div class="toy stack"><div class="dice">${r ? die(r[0], "spin") + die(r[1], "spin") : die(3) + die(4)}</div><div class="big">${r ? r[0] + r[1] + 1 : "2d6+1"}</div>${r ? `<div class="cap">${r[0]} + ${r[1]} + 1</div>` : ""}</div><span class="hint">tap to roll 2d6+1</span>`; };
    el.addEventListener("click", () => { r = [1 + rnd(6), 1 + rnd(6)]; draw(); }); draw();
  },
  "play-dice5e"(el) {
    let r = [6, 5, 3, 1];
    const draw = (sp) => {
      const low = r.indexOf(Math.min(...r)), total = r.reduce((a, b) => a + b, 0) - r[low];
      el.innerHTML = `<div class="toy stack"><div class="dice" style="transform:scale(.75);margin:-6px 0;flex-wrap:nowrap">${r.map((n, i) => die(n, (i === low ? "dim " : "") + (sp ? "spin" : ""))).join("")}</div><div class="big">${total}</div><div class="cap">4d6 keep 3</div></div><span class="hint">tap to roll a stat</span>`;
    };
    el.addEventListener("click", () => { r = [0, 0, 0, 0].map(() => 1 + rnd(6)); draw(true); }); draw();
  },
  "play-liars-dice"(el) {
    let open = false, cup = [5, 2, 5, 1, 6];
    const draw = () => {
      const fives = cup.filter((n) => n === 5 || n === 1).length;
      el.innerHTML = `<div class="toy stack"><div class="cap">bid: three 5s</div>
        ${open ? `<div class="dice" style="transform:scale(.55);margin:-14px -30px;flex-wrap:nowrap">${cup.map((n) => die(n, "spin")).join("")}</div><div class="cap" style="color:${fives >= 3 ? "#7ee2b1" : "#ff8f7a"}">${fives} found · ${fives >= 3 ? "the bid stands" : "liar!"}</div>`
          : `<svg viewBox="0 0 60 50" width="78" role="img" aria-label="A dice cup, upside down"><path d="M10 48 L16 6 Q30 0 44 6 L50 48 Z" fill="#7a4a2a" stroke="#3a2210" stroke-width="2"/><rect x="8" y="44" width="44" height="5" rx="2" fill="#5a341c"/></svg><div class="cap">call it?</div>`}</div>
        <span class="hint">${open ? "tap to shake again" : "tap to lift the cup"}</span>`;
    };
    el.addEventListener("click", () => { if (open) cup = cup.map(() => 1 + rnd(6)); open = !open; draw(); }); draw();
  },
  "play-odds"(el) {
    const ways = [1, 2, 3, 4, 5, 6, 5, 4, 3, 2, 1];
    let at = 7;
    const draw = () => {
      const bars = ways.map((w, i) => { const t = i + 2; return `<rect x="${i * 9 + 1}" y="${60 - w * 9}" width="7" height="${w * 9}" rx="1" fill="${t >= at ? "#c8442f" : "#2b241a33"}"/><text x="${i * 9 + 4.5}" y="69" font-size="5" text-anchor="middle" fill="#2b241a">${t}</text>`; }).join("");
      const n = ways.slice(at - 2).reduce((a, b) => a + b, 0);
      el.innerHTML = `<div class="toy stack" style="gap:4px"><svg viewBox="0 0 100 72" style="width:80%" role="img" aria-label="Chances of each 2d6 total">${bars}</svg><div class="big" style="font-size:1.25rem">${n}/36</div><div class="cap">2d6 at least ${at}</div></div><span class="hint">tap to move the line</span>`;
    };
    el.addEventListener("click", () => { at = at >= 12 ? 2 : at + 1; draw(); }); draw();
  },
  "play-tarot"(el) {
    const major = ["0 · The Fool", "I · The Magician", "II · The High Priestess", "III · The Empress", "IV · The Emperor", "VI · The Lovers", "VII · The Chariot", "VIII · Strength", "IX · The Hermit", "X · Wheel of Fortune", "XI · Justice", "XIII · Death", "XIV · Temperance", "XVII · The Star", "XVIII · The Moon", "XIX · The Sun", "XXI · The World"];
    let up = null;
    const draw = () => {
      const [num, name] = up ? up.card.split(" · ") : [];
      el.innerHTML = `<div class="toy"><div class="card ${reduced ? "" : up ? "spin" : ""}" style="width:78px;height:122px;font-size:.78rem;${up ? `background:#f8efd8;color:#3a2a10;transform:${up.rev ? "rotate(180deg)" : "none"}` : "background:repeating-linear-gradient(45deg,#0f3d3a 0 5px,#d4b46a 5px 7px);border:3px solid #d4b46a"}"><div style="display:grid;gap:6px;text-align:center;padding:4px">${up ? `<span style="font-family:var(--lid-font);font-size:1rem">${num}</span><span>${name}</span>` : ""}</div></div></div>
        <span class="hint">${up ? (up.rev ? "reversed · tap to draw again" : "upright · tap to draw again") : "tap to draw"}</span>`;
    };
    el.addEventListener("click", () => { up = { card: pick(major), rev: rnd(4) === 0 }; draw(); }); draw();
  },
  "play-catgrid"(el) {
    const regions = ["eeeeb", "aeceb", "acccb", "dccdd", "ddddd"], colours = { a: "#ffd1dc", b: "#c9e4ff", c: "#d6f5c9", d: "#ffe7b3", e: "#e4d4ff" };
    const answer = new Set(["0,2", "1,0", "2,4", "3,1", "4,3"]); // the one answer
    let cats = new Set(["0,2"]);
    const draw = () => {
      let s = "";
      for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) {
        const k = r + "," + c;
        s += `<rect x="${c * 16}" y="${r * 16}" width="16" height="16" fill="${colours[regions[r][c]]}" stroke="#3a102033" stroke-width=".6"/>` + (cats.has(k) ? `<text x="${c * 16 + 8}" y="${r * 16 + 12}" font-size="11" text-anchor="middle">🐈</text>` : "");
      }
      const won = cats.size === 5 && [...cats].every((k) => answer.has(k));
      el.innerHTML = `<div class="toy stack" style="gap:4px"><svg viewBox="0 0 80 80" style="width:72%;border-radius:3px" role="img" aria-label="A five by five cat grid" data-grid>${s}</svg><div class="cap">${won ? "solved!" : `${cats.size} of 5 cats`}</div></div><span class="hint">a cat a row, column, colour</span>`;
      el.querySelector("svg").addEventListener("click", (e) => {
        const box = e.currentTarget.getBoundingClientRect(), c = Math.floor(((e.clientX - box.left) / box.width) * 5), r = Math.floor(((e.clientY - box.top) / box.height) * 5), k = r + "," + c;
        if (r < 0 || c < 0 || r > 4 || c > 4) return;
        cats.has(k) ? cats.delete(k) : cats.add(k); draw();
      });
    };
    draw();
  },
  "daily-word"(el) {
    const rows = [["STALL", "xbxyx"], ["LIGHT", "ybxxx"], ["LAMPS", "ggggg"]].map(([w, m]) => [w, m]);
    let n = 1;
    const fill = { g: "#3fa67a", y: "#e2a52f", x: "#8a7f5a", b: "#8a7f5a" };
    const draw = () => {
      el.innerHTML = `<div class="toy stack" style="gap:5px">${rows.slice(0, n).map(([w, m], ri) => `<div style="display:flex;gap:4px">${[...w].map((ch, i) => `<span class="${ri === n - 1 && !reduced ? "spin" : ""}" style="width:28px;height:28px;display:grid;place-items:center;border-radius:4px;background:${fill[m[i]]};color:#fff;font-family:var(--lid-font);font-size:.95rem;animation-delay:${i * 60}ms">${ch}</span>`).join("")}</div>`).join("")}
        <div class="cap" style="margin-top:4px">${n === 3 ? "got it in three" : "guess " + n}</div></div><span class="hint">${n === 3 ? "tap to start over" : "tap to guess again"}</span>`;
    };
    el.addEventListener("click", () => { n = n === 3 ? 1 : n + 1; draw(); }); draw();
  },
  "play-quiz"(el) {
    const qs = [["Every step holds, and Pell calls the others", "down"], ["The first lanterns go up along the", "river"], ["Cogwen laughs, a sound like a dropped", "spanner"]];
    let i = 0, shown = false;
    const draw = () => { const [q, a] = qs[i]; el.innerHTML = `<div class="toy stack"><div class="cap">fill in the word</div><div class="phrase">${esc(q)} <span class="blank">${shown ? esc(a) : "?"}</span>.</div></div><span class="hint">${shown ? "tap for another" : "tap to reveal"}</span>`; };
    el.addEventListener("click", () => { if (shown) i = (i + 1) % qs.length; shown = !shown; draw(); }); draw();
  },
  "play-life"(el) {
    const N = 28; let g = new Uint8Array(N * N);
    const seed = () => { g = new Uint8Array(N * N); for (let i = 0; i < g.length; i++) g[i] = rnd(100) < 30 ? 1 : 0; };
    seed();
    el.innerHTML = `<div class="toy" style="padding:6px"><canvas width="${N * 6}" height="${N * 6}" style="width:100%;height:100%;object-fit:contain;image-rendering:pixelated" role="img" aria-label="Conway's Game of Life, running"></canvas></div><span class="hint">tap for new soup</span>`;
    const cv = el.querySelector("canvas"), cx = cv.getContext("2d");
    const step = () => { const n = new Uint8Array(N * N); for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { let s = 0; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (dx || dy) s += g[((y + dy + N) % N) * N + ((x + dx + N) % N)]; const a = g[y * N + x]; n[y * N + x] = s === 3 || (a && s === 2) ? 1 : 0; } g = n; };
    const paint = () => { cx.fillStyle = "#06100a"; cx.fillRect(0, 0, cv.width, cv.height); cx.fillStyle = "#9ff0b4"; for (let i = 0; i < g.length; i++) if (g[i]) cx.fillRect((i % N) * 6 + 0.5, Math.floor(i / N) * 6 + 0.5, 5, 5); };
    el.addEventListener("click", () => { seed(); paint(); });
    paint();
    if (!reduced) setInterval(() => { if (!document.hidden) { step(); paint(); } }, 160);
  },
  "play-bureau"(el) {
    const windows = ["Window 3", "Window 7", "Window 3", "the Annex", "Window 7"];
    let k = 0;
    const draw = () => {
      el.innerHTML = `<div class="toy stack" style="color:#1e1d12"><div style="font-family:var(--mono);font-size:.68rem;text-align:left;background:#fffdf2;border:1px solid #0003;padding:8px 10px;width:84%;box-shadow:2px 2px 0 #0002;position:relative">FORM 9-A · REQUEST<br>visit no. ${k + 1}<br>status: pending
        <span class="${reduced ? "" : "spin"}" style="position:absolute;right:-8px;bottom:-10px;transform:rotate(-10deg);font-family:var(--lid-font);font-size:.62rem;color:#b3261e;border:2px solid #b3261e;padding:1px 5px;background:#fffdf2cc">SEE ${windows[k % windows.length].toUpperCase()}</span></div></div>
        <span class="hint">tap to go where it says</span>`;
    };
    el.addEventListener("click", () => { k++; draw(); }); draw();
  },
};

/* ---------- the cupboard ---------- */
const games = [TABLE, ...DATA.games];
const byId = Object.fromEntries(games.map((g) => [g.id, g]));
$("lede").textContent = `${DATA.games.length} games and a table with ${DATA.worlds.length} worlds. Poke the lids, then open a box to play.`;
$("jump").innerHTML = SHELVES.map((s) => `<a href="#${s.id}">${esc(s.name)}</a>`).join("");

function lid(g) {
  const L = LIDS[g.id] || { shelf: "puzzle", name: g.title, lid: "#555", ink: "#fff", art: "#0002" };
  const keeps = L.keeps || (/writes nothing/.test(g.notes) ? "saves nothing" : "saves every move");
  const [n, unit] = g.checked ? [g.checked.split(" ")[0], g.checked.split(" ")[1]] : [];
  return `<article class="box" style="--lid:${L.lid};--ink:${L.ink};--art:${L.art}">
      ${L.start ? `<div class="sticker">start<b>here</b>5 worlds</div>` : ""}${g.checked ? `<div class="sticker" title="Checked against game-lab's rules on ${esc(g.checked)}">checked<b>${esc(n)}</b>${esc(unit)}</div>` : ""}
      <div class="maker">Die·Namic</div>
      <div class="art" data-toy="${esc(g.id)}"></div>
      <div class="lid-foot">
        <button class="lid-title" data-open="${esc(g.id)}">${esc(L.name)}</button>
        <div class="lid-line"><span>${esc(keeps)}</span><button class="lid-open" data-open="${esc(g.id)}">${g.id === "the-table" ? "Sit down" : "Open"}</button></div>
      </div>
    </article>`;
}

$("shelves").innerHTML = SHELVES.map((s) => {
  const here = games.filter((g) => (LIDS[g.id] || { shelf: "puzzle" }).shelf === s.id);
  return `<section class="shelf" id="${s.id}" aria-labelledby="h-${s.id}">
    <div class="shelf-head"><h2 id="h-${s.id}">${esc(s.name)}</h2><p>${esc(s.line)}</p></div>
    <div class="row">${here.map(lid).join("")}</div>
    <div class="plank" aria-hidden="true"></div>
  </section>`;
}).join("");

document.querySelectorAll("[data-toy]").forEach((el) => { const t = TOYS[el.dataset.toy]; if (t) t(el); });

/* ---------- inside the box ---------- */
function openBox(id) {
  const g = byId[id], L = LIDS[id] || { name: g.title };
  const body = id === "the-table"
    ? `<p class="lede">${esc(g.summary)}</p>
       <div><h4>The worlds</h4><p>${DATA.worlds.map(esc).join(" · ")}</p></div>
       <p><a class="go" href="table.html">Sit down at the table</a></p>
       <p class="note">${esc(g.came)}</p>`
    : `<p class="lede">${esc(g.summary)}</p>
       ${DATA.pages && DATA.pages[id] ? `<p><a class="go" href="${esc(DATA.pages[id])}.html">Play it here</a></p>` : ""}
       ${g.commands.length ? `<div><h4>How to play</h4><div class="cmds"><button class="copy" data-copy>Copy</button><pre id="cmd-text">${esc(g.commands.join("\n"))}</pre></div></div>` : ""}
       ${g.notes ? `<p class="note">${esc(g.notes.replace(/`/g, ""))}</p>` : ""}
       ${g.came ? `<div><h4>Where it came from</h4><p>${esc(g.came)}</p></div>` : ""}
       ${g.card ? `<p><a class="card-link" href="${esc(g.card)}" target="_blank" rel="noopener">Everything it does and refuses, on its card in willow</a></p>` : ""}`;
  $("inside-body").innerHTML = `
    <div class="inside-head"><div><h3 id="inside-title">${esc(L.name)}</h3>${id !== "the-table" ? `<div class="add-on">willow add-on · ${esc(g.id)}</div>` : ""}</div>
      <button class="close" data-close aria-label="Close">×</button></div>${body}`;
  $("inside").showModal();
}
document.addEventListener("click", (e) => {
  const o = e.target.closest("[data-open]"); if (o) return openBox(o.dataset.open);
  if (e.target.closest("[data-close]") || e.target === $("inside")) return $("inside").close();
  const c = e.target.closest("[data-copy]");
  if (c) {
    const text = $("cmd-text").textContent;
    navigator.clipboard.writeText(text).then(() => { c.textContent = "Copied"; }, () => {
      const r = document.createRange(); r.selectNodeContents($("cmd-text")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); c.textContent = "Selected";
    });
  }
});
</script>
