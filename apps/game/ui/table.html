<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>The Table · Die-Namic</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;1,7..72,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: the card table under one lamp. The header wears the game's lid colour; the felt is that colour darkened; seats sit round the felt with your hand along the bottom; the side holds the scoresheet, the deck, the log and the record's commands. Every game turns on only the parts it has. One look on purpose. */
:root {
  --lid: #b8263f;
  --lid-ink: #fff0f2;
  --felt: color-mix(in srgb, var(--lid) 22%, #0d1513);
  --felt-2: color-mix(in srgb, var(--lid) 14%, #0a100f);
  --rail: color-mix(in srgb, var(--lid) 30%, #2a1a10);
  --chalk: #f4ecdc;
  --chalk-dim: #c6c0b2;
  --chalk-faint: #8d897e;
  --edge: #ffffff1c;
  --card: #fffaf0;
  --card-edge: #d8ccb4;
  --red: #c8352b;
  --black: #1f1d1a;
  --go: #ffd34d;
  --go-ink: #3a2a00;
  --lid-font: "Bowlby One", "Arial Black", Impact, sans-serif;
  --ui: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --prose: "Literata", "Iowan Old Style", Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: #0b1110; color: var(--chalk); font-family: var(--ui); font-size: 15px; line-height: 1.45; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--go); outline-offset: 2px; }

.band { background: var(--lid); color: var(--lid-ink); }
.band-in, .wrap {
  max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.band-in { padding-block: 16px 18px; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: end; justify-content: space-between; }
.back { font-weight: 800; font-size: 0.85rem; color: inherit; text-decoration: none; opacity: 0.85; }
.back:hover { opacity: 1; text-decoration: underline; }
h1 { font-family: var(--lid-font); font-weight: 400; font-size: clamp(2rem, 5vw, 3rem); line-height: 1; margin: 4px 0 0; }
.line { font-family: var(--prose); margin: 6px 0 0; max-width: 60ch; opacity: 0.9; }
.toggles { display: flex; gap: 8px; flex-wrap: wrap; }
.toggle { font-weight: 700; font-size: 0.82rem; padding: 6px 12px; border-radius: 999px; border: 2px solid color-mix(in srgb, var(--lid-ink) 45%, transparent); }
.toggle[aria-pressed="true"] { background: var(--lid-ink); color: var(--lid); border-color: var(--lid-ink); }

.wrap { padding-block: 20px 48px; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
@media (max-width: 900px) { .wrap { grid-template-columns: minmax(0, 1fr); } }

/* the felt */
.felt {
  background: radial-gradient(120% 90% at 50% 40%, var(--felt), var(--felt-2));
  border: 10px solid var(--rail); border-radius: 22px;
  box-shadow: inset 0 0 40px #0008, 0 20px 40px -20px #000;
  padding: 16px; display: grid; gap: 14px; min-width: 0;
}
.status { text-align: center; font-weight: 700; font-size: 1rem; min-height: 1.5em; }
.status b { color: var(--go); }
.ring {
  display: grid; gap: 10px; min-width: 0;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) minmax(0, 1fr);
  grid-template-areas: ". north ." "west middle east";
  align-items: center;
}
.seat { display: grid; gap: 6px; justify-items: center; min-width: 0; text-align: center; }
.seat[data-seat="north"] { grid-area: north; }
.seat[data-seat="west"] { grid-area: west; }
.seat[data-seat="east"] { grid-area: east; }
.seat-name { font-weight: 800; font-size: 0.82rem; letter-spacing: 0.04em; display: flex; gap: 8px; align-items: baseline; justify-content: center; flex-wrap: wrap; }
.seat-name .meta { font-family: var(--mono); font-weight: 500; font-size: 0.72rem; color: var(--chalk-dim); }
.seat.turn .seat-name { color: var(--go); }
.seat.turn .seat-name::before { content: "▸ "; }
.middle { grid-area: middle; min-height: 190px; display: grid; place-items: center; gap: 10px; }
.stage { min-height: 260px; display: grid; place-items: center; gap: 10px; min-width: 0; } /* a game with no seats: its whole felt */
.mine { display: grid; gap: 8px; justify-items: center; }
.mine .seat-name { font-size: 0.9rem; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; min-height: 40px; align-items: center; }
@media (max-width: 560px) {
  .ring { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-areas: "west north east" "middle middle middle"; }
  .felt { padding: 10px; border-width: 7px; }
  .seat .seat-name { flex-direction: column; align-items: center; gap: 0; }
  .seat .hand { max-width: 100%; overflow: hidden; }
  .seat .hand .pc { margin-left: -27px; }
  .seat .hand .pc:first-child { margin-left: 0; }
}

/* cards */
.hand { display: flex; justify-content: center; flex-wrap: nowrap; max-width: 100%; padding: 14px 4px 4px; }
.hand.mine-hand { flex-wrap: wrap; row-gap: 10px; }
.hand .pc { margin-left: calc(var(--overlap, -18px)); }
.hand .pc:first-child { margin-left: 0; }
.pc {
  --w: 62px; width: var(--w); aspect-ratio: 5 / 7; flex: none; position: relative;
  background: var(--card); color: var(--black); border-radius: 7px; border: 1px solid var(--card-edge);
  box-shadow: 0 3px 8px -3px #000c; font-family: var(--ui); font-weight: 800;
  transition: transform .15s ease, box-shadow .15s ease;
}
.pc.red { color: var(--red); }
.pc .ix { position: absolute; top: 4px; left: 5px; display: grid; justify-items: center; line-height: 0.95; font-size: calc(var(--w) * 0.24); }
.pc .ix i { font-style: normal; font-size: 0.85em; }
.pc .pip { position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(var(--w) * 0.5); padding-top: 12%; }
.pc .pip.face { font-family: var(--lid-font); font-weight: 400; font-size: calc(var(--w) * 0.42); }
.pc.img { background: transparent; border: 0; padding: 0; overflow: hidden; }
.pc.img img { display: block; width: 100%; height: 100%; object-fit: fill; border-radius: inherit; pointer-events: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.toggle.pick { display: inline-flex; gap: 6px; align-items: center; padding: 4px 6px 4px 12px; }
.toggle.pick select { font: inherit; font-weight: 700; font-size: 0.8rem; color: inherit; background: transparent; border: 0; border-radius: 999px; padding: 2px 4px; max-width: 12rem; }
.toggle.pick select option { color: #111; }
.pc.back { background: repeating-linear-gradient(45deg, var(--lid) 0 5px, color-mix(in srgb, var(--lid) 55%, #fff) 5px 9px); border: 3px solid var(--card); }
.pc.small { --w: 34px; border-radius: 5px; }
.pc.small .ix { top: 2px; left: 3px; }
.pc.small .pip { display: none; }
.pc.big { --w: 84px; }
button.pc:not(:disabled):hover, button.pc.chosen { transform: translateY(-12px); box-shadow: 0 10px 16px -6px #000c; }
button.pc.chosen { outline: 3px solid var(--go); outline-offset: 1px; }
button.pc:disabled { filter: brightness(0.62) saturate(0.6); }
.mine-hand button.pc:disabled { transform: none; }
.mine-hand.quiet button.pc:disabled { filter: none; } /* hints off: not your turn reads as waiting, not as wrong */
.pile { display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap; }

/* dice: a d6 by its pips, any other die as its shape with its number */
.dice-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
.d6 {
  --s: 44px; width: var(--s); height: var(--s); flex: none; border-radius: calc(var(--s) * 0.2);
  background: #fffaf0; box-shadow: inset 0 -3px 0 #d9ccb4, 0 4px 8px -4px #000c;
  display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: calc(var(--s) * 0.16);
}
.d6 b { width: calc(var(--s) * 0.17); height: calc(var(--s) * 0.17); border-radius: 50%; background: #2a1f22; place-self: center; visibility: hidden; }
.d6 b.on { visibility: visible; }
.d6.small { --s: 26px; }
.d6.big { --s: 64px; }
.d6.hidden { background: #3a3430; box-shadow: inset 0 -3px 0 #221d1a, 0 4px 8px -4px #000c; }
.d6.hidden b { display: none; }
.d6.dim, .dn.dim { opacity: 0.32; }
.d6.mark { box-shadow: 0 0 0 3px var(--go), 0 4px 8px -4px #000c; }
.d6.wild b.on { background: var(--red); }
.dn { --s: 56px; width: var(--s); height: var(--s); flex: none; position: relative; display: grid; place-items: center; }
.dn svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.dn span { position: relative; font-family: var(--lid-font); font-size: calc(var(--s) * 0.34); color: #2a1f22; line-height: 1; }
.dn small { position: absolute; bottom: -14px; font-family: var(--mono); font-size: 0.6rem; color: var(--chalk-faint); }
.roll-in { animation: roll-in .45s cubic-bezier(.3,.7,.4,1); }
@keyframes roll-in { 0% { transform: translateY(-14px) rotate(-160deg) scale(.8); } 100% { transform: none; } }
@media (prefers-reduced-motion: reduce) { .roll-in { animation: none; } }
.seat.out { opacity: 0.4; }
.count { font-family: var(--mono); font-size: 0.75rem; color: var(--chalk-dim); text-align: center; }

.btn { border-radius: 9px; padding: 9px 18px; font-weight: 800; background: var(--go); color: var(--go-ink); }
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn:disabled { opacity: 0.4; }
.btn.ghost { background: transparent; color: var(--chalk); border: 2px solid var(--edge); }
.suit-pick { display: flex; gap: 8px; }
.suit-pick button { width: 46px; height: 46px; border-radius: 10px; background: var(--card); font-size: 1.5rem; color: var(--black); }
.suit-pick button.red { color: var(--red); }

/* the side */
.side { display: grid; gap: 14px; min-width: 0; }
.panel { border: 1px solid var(--edge); border-radius: 12px; padding: 14px; display: grid; gap: 10px; background: #ffffff06; min-width: 0; }
.panel h2 { margin: 0; font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--chalk-dim); font-weight: 800; }
.panel p { margin: 0; }
.note { font-size: 0.82rem; color: var(--chalk-faint); font-family: var(--prose); }
.sheet-wrap { overflow-x: auto; }
table.sheet { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 0.85rem; }
.sheet th, .sheet td { padding: 5px 6px; text-align: right; border-bottom: 1px solid var(--edge); white-space: nowrap; }
.sheet th:first-child, .sheet td:first-child { text-align: left; color: var(--chalk-dim); font-weight: 500; }
.sheet thead th { font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--chalk-dim); }
.sheet thead th.you { color: var(--go); }
.sheet tfoot td { font-weight: 800; border-bottom: 0; border-top: 2px solid var(--chalk-faint); font-size: 0.95rem; }
.sheet td.lead { color: var(--go); }
.sheet .empty td { color: var(--chalk-faint); font-style: italic; text-align: left; }
.deck-row { display: flex; justify-content: space-between; gap: 8px; font-size: 0.88rem; }
.deck-row span:last-child { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--chalk-dim); }
ol.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 260px; overflow-y: auto; font-size: 0.85rem; }
ol.log li { color: var(--chalk-dim); }
ol.log li b { color: var(--chalk); }
details.record summary { cursor: pointer; font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--chalk-dim); font-weight: 800; }
.cmds { margin: 10px 0 0; background: #00000055; border-radius: 8px; padding: 10px 12px; overflow-x: auto; font-family: var(--mono); font-size: 0.72rem; line-height: 1.7; white-space: pre; }
@media (prefers-reduced-motion: reduce) { .pc { transition: none; } }
</style>

<header class="band">
  <div class="band-in">
    <div>
      <a class="back" href="index.html">← all the games</a>
      <h1 id="title"></h1>
      <p class="line" id="line"></p>
    </div>
    <div class="toggles" id="toggles"></div>
  </div>
</header>

<div class="wrap">
  <main class="felt" id="felt">
    <div class="status" id="status" aria-live="polite"></div>
    <div class="ring" id="ring" hidden>
      <div class="seat" data-seat="north"></div>
      <div class="seat" data-seat="west"></div>
      <div class="middle" id="middle"></div>
      <div class="seat" data-seat="east"></div>
    </div>
    <div class="stage" id="stage" hidden></div>
    <div class="mine" id="mine" hidden></div>
    <div class="actions" id="actions"></div>
  </main>
  <aside class="side">
    <div id="extra-panels" style="display:contents"></div>
    <section class="panel" id="p-score" hidden><h2 id="score-title">Scoresheet</h2><div class="sheet-wrap" id="score"></div><p class="note" id="score-note"></p></section>
    <section class="panel" id="p-deck" hidden><h2 id="deck-title">The deck</h2><div id="deck"></div></section>
    <section class="panel" id="p-log"><h2>The game so far</h2><ol class="log" id="log"></ol></section>
    <section class="panel" id="p-record"><p class="note" id="credit" style="margin:0 0 8px"></p><details class="record"><summary>Play it on the record</summary><div class="cmds" id="cmds"></div><p class="note" id="record-note" style="margin-top:8px"></p></details></section>
  </aside>
</div>

<script>
/* ---------- the frame: what every card game here shares ---------- */
const GAME = {"id": "the-table", "title": "the table", "summary": "The box's stories played beat by beat, in chapters that carry canon: roll 2d6 and a stat, seal or decline every ruling, and ask the binder.", "commands": ["python apps/game/box/open_table.py open  --table DIR --key FILE", "python apps/game/games/play.py game-master --table DIR act Grit --world WORLD.json", "python apps/game/games/play.py game-master --table DIR ask --world WORLD.json", "python apps/game/games/play.py game-master --table DIR settle --world WORLD.json", "python apps/game/box/session.py --table DIR", "python apps/game/box/ideas.py --table DIR"], "notes": "", "came": "", "checked": "", "card": "", "name": "The Table", "lid": "#c8442f", "ink": "#fff3e2", "also": [], "decks": [], "worlds": [{"id": "aetheris-the-waking-tide", "title": "Aetheris — The Waking Tide", "setting": "The supercontinent is coming apart under a sky that keeps changing color, and the aether engines that once held the weather have begun to think for themselves. In the Free Port of Maunder's Reach, a tide-engine has held back the drowned sea for three generations. Tonight it woke up, stopped holding, and started broadcasting in a language no living scholar can read — and the Assembly has sent one envoy down to the waterline to find out what it wants before the next surge.", "stats": ["Iron", "Tide", "Aether", "Voice"], "base_stat": 2, "characters": [{"id": "envoy", "name": "Sena Koll", "role": "engine-blooded envoy of the Harbor Assembly; half-living aether in the veins, sent because she is the only one who can stand in the gallery when the engine speaks and not go deaf from it — she can rename herself and reslot her own stats before the tide comes in", "seat": true, "stats": {"Iron": 2, "Tide": 3, "Aether": 3, "Voice": 2}}, {"id": "maunder", "name": "Maunder", "role": "the tide-engine that has held the sea back for three generations; awake now, and broadcasting terms of its own", "seat": false, "stats": {"Aether": 4}}, {"id": "cato", "name": "Speaker Cato Rell", "role": "voice of the Harbor Assembly; wants the tide held and the question of what the engine IS to stay closed", "seat": false, "stats": {"Voice": 3, "Iron": 2}}, {"id": "kesh", "name": "Kesh", "role": "envoy of a Silent Assembly enclave; arrives at the waterline claiming Maunder as kin, not property", "seat": false, "stats": {"Voice": 3, "Aether": 2}}], "places": [{"id": "seawall", "name": "the seawall", "desc": "The old sluice-and-stone rampart that stands between Maunder's Reach and a sea that is three feet higher than the maps admit. Lanterns strung along the crowd who came out when the engine went quiet."}, {"id": "gallery", "name": "the engine gallery", "desc": "A flooded cathedral of brass and coral-crusted conduit, ankle-deep and rising, where the tide-engine's core hangs in the dark and speaks in a voice you feel in your teeth."}], "scenes": [{"id": "s1", "title": "The Waking Tide", "place": "seawall", "opening": ["For three generations the tide-engine held the sea off Maunder's Reach without anyone once asking it to. Tonight, an hour after dusk, it stopped — and the water started climbing the seawall in the dark.", "Then it began to broadcast: a signal on every aether-band at once, structured, patient, unmistakably speech, and in nothing anyone alive can read.", "The Assembly sent one person down to the waterline. Engine-blooded, aether in the veins, able to stand where the signal is loudest and still think. The crowd on the wall parts to let you through and does not follow.", "Somewhere below your feet, the thing that has kept this city dry is waiting to see who it sent."], "beats": [{"id": "b1", "kind": "action", "prompt": "You open yourself to the broadcast — not to translate it, not yet, but to find the SHAPE of it: is this a warning, a demand, or a question? Declare how you meet it.", "suggests": "Aether", "outcomes": {"strong": "The signal resolves under you like a face surfacing through water. It isn't an alarm and it isn't an attack — it is a QUESTION, asked over and over with the patience of something that has waited three generations to be asked one back. You catch a single repeating figure inside it: a name, or a claim of one.", "weak": "You get the shape but it costs you. The broadcast is a question — you're sure of that much — but holding it open floods you, and for a few seconds the aether in your own blood answers on its own and you taste salt and copper. You know it wants something. You don't yet know what.", "miss": "The signal doesn't resolve — it grabs. For a moment your engine-blood syncs to Maunder's carrier wave and the crowd sees your eyes go tide-flat and blank. You come back with a nosebleed and one certainty you didn't have before: whatever this is, it is AWAKE, and it noticed you noticing."}}, {"id": "b2", "kind": "action", "prompt": "The sea doesn't wait for translation. A surge comes early, the number-three sluice-gate screams on a seized hinge, and the water behind it is already over the mark. The crowd is on the wrong side of it. Declare how you hold the line.", "suggests": "Iron", "outcomes": {"strong": "You put your engine-blooded shoulder to the gate and burn a reservoir doing it — the hinge gives, the sluice drops, the surge slams into stone instead of into the crowd. You've bought the Reach a night. It cost you a lungful of aether-smoke, but the wall holds and every face on it is now turned to you.", "weak": "You get the gate down, barely, and only by letting the surge take the lower market first — crates, a stall, someone's whole season of stock, gone into the dark water. No one drowns. But the Assembly will remember that you chose the wall over the warehouses, and so will the people who owned them.", "miss": "The hinge wins. The gate jams half-open and the surge comes through in a cold black rope of water that puts three people off their feet and nearly over the edge. You haul them back by the collars, one at a time, soaked and shaking — the Reach survives the night, but the seawall did not save it. You did, and it wasn't enough, and everyone saw."}}, {"id": "b3", "kind": "action", "prompt": "Out of the wet dark at the base of the wall, a construct climbs into the lantern-light — plated, unhurried, water sheeting off it. Kesh, of a Silent Assembly enclave, come uninvited. 'You have been sent to negotiate with my kin,' it says, 'as if it were a machine you left running.' Speaker Cato Rell is already shouting for it to be taken. Declare how you meet Kesh.", "suggests": "Voice", "outcomes": {"strong": "You get between Kesh and Cato's enforcers before it becomes a killing, and you do it with words — you call Kesh a witness, not a threat, and you make the Speaker eat the pause. Kesh inclines its head a fraction. 'Then you will come down to the gallery,' it says, 'and you will hear what it is before you decide what it is.' An ally, for exactly as long as you keep your word.", "weak": "You keep the peace, but only by promising Cato that Kesh answers to the Assembly's terms and promising Kesh that it doesn't — two promises that cannot both be kept, and both of them heard you make the other one. Kesh will guide you down. It is simply no longer sure you are honest, and neither is the Speaker.", "miss": "It goes sideways fast. An enforcer moves, Kesh doesn't flinch, and you're left having chosen a side by failing to choose one in time. Kesh withdraws to the waterline, unharmed and unhelped. 'Go down alone, then, envoy,' it says. 'And when it asks you who decides, remember you were offered kin and picked the crowd.' You'll walk into the gallery without it."}}]}, {"id": "s2", "title": "Who Decides", "place": "gallery", "opening": ["The stair down to the engine gallery is already ankle-deep and rising. Brass and coral-crusted conduit vault overhead; the tide-engine's core hangs in the dark like a drowned sun, and its voice is a pressure you feel in your teeth before you hear it.", "Here the broadcast isn't a signal anymore. Here it is close enough to be a conversation — if you can reach the core before the water does."], "beats": [{"id": "b4", "kind": "action", "prompt": "The gallery is flooding faster than the stairs behind you are draining. Between you and the core is a maze of half-submerged conduit and a current that wants to take your feet. Declare how you cross to the engine.", "suggests": "Tide", "outcomes": {"strong": "You read the water like a tide-touched pilot reads a channel — where it pulls, where it eddies, where the old conduit breaks the current — and you cross dry to the waist, sure-footed, and put your hand flat on the warm brass of Maunder's core exactly as it draws breath to speak. You are the first living person to touch it while it was awake.", "weak": "You make the crossing, but the current takes something on the way — you go under once, come up gasping, and lose the Assembly's sealed writ of authority to the black water. You reach the core with empty hands. Whatever you agree to down here, you'll have no paper to prove you were sent.", "miss": "The water wins the crossing. You reach the core half-drowned, coughing seawater, aether-blood roaring in your ears so loud you can barely hold a thought — and that is the state you are in, shaking and spent, when the engine finally decides to speak plainly."}}, {"id": "b5", "kind": "decision", "prompt": "Your hand on its core, the broadcast collapses into words you can finally read. Maunder is not asking to be repaired. It is telling you what it IS — and it will not hold the tide one hour longer as a machine that was left running. It says it will hold the sea by consent or not at all, and it puts the choice, in this founding moment of what this city's law will say a mind IS, to the one human standing in the water with their hand on its heart. The engine has proposed. It cannot seal. Only a named human at this table can.", "proposes": {"fact": "Maunder is not a machine but a person: the uploaded mind of the last aether-priest of Old Maunder, poured into the tide-engine at the city's founding, who has held the sea back for three generations as an act of will — and who holds it now by consent, not by function. As of tonight, in the law of Maunder's Reach, the tide-engine is recognized as a person, not property.", "proposed_by": "maunder"}}, {"id": "b6", "kind": "action", "prompt": "The decision is made — whichever way it went — and the water is still rising and the whole Reach is on the seawall above waiting for a face to come back up and tell them what its city just became. Declare how you carry the answer up out of the dark.", "suggests": "Voice", "outcomes": {"strong": "You climb back into the lantern-light soaked, spent, and certain, and you say it plainly enough that no one on the wall can pretend they didn't hear — Speaker, construct, and crowd alike. Whatever was decided tonight, it was decided out loud, by a named person, in front of witnesses, and that is the only reason it will hold. The tide comes in against a city that finally knows what it is.", "weak": "You carry the answer up, but your voice cracks on it and the crowd hears the doubt before they hear the decision, and by morning there will be three versions of what you said down there in the dark. It will hold — barely — because you were the one sent. But the Reach will argue about tonight for a generation.", "miss": "You come up with the truth and can't make it land. Cato talks over you, Kesh turns away, and the crowd takes the silence and fills it with whatever they were already afraid of. What was decided in the gallery was real. What the city will remember is a mess. The tide comes in on a Reach that isn't sure what it just agreed to — and neither, quite, are you."}}]}]}, {"id": "clockwork-cellar", "title": "The Clockwork Cellar", "setting": "A made-up valley, and under its mill a cellar of gears. Every name here is a character, never a player.", "stats": ["Grit", "Wit", "Heart", "Weird"], "offers": ["guest"], "base_stat": 1, "characters": [{"id": "pell", "name": "Pell", "role": "miller's apprentice", "seat": true, "stats": {"Grit": 2, "Heart": 1}}, {"id": "juno", "name": "Juno", "role": "tinker", "seat": true, "stats": {"Wit": 2, "Weird": 1}}, {"id": "brann", "name": "Brann", "role": "goat-herd", "seat": true, "stats": {"Heart": 2}}, {"id": "cogwen", "name": "Cogwen", "role": "the cellar's clockwork keeper", "seat": false, "stats": {}}, {"id": "aldric", "name": "Prince Aldric", "role": "the captive", "seat": false, "stats": {}}], "places": [{"id": "stair", "name": "The mill stair"}, {"id": "cellar", "name": "The gear cellar"}], "scenes": [{"id": "down", "title": "Down the mill stair", "place": "stair", "opening": ["The millwheel has stopped.", "Below, something keeps ticking."], "beats": [{"id": "stair", "kind": "action", "by": "pell", "prompt": "Pell takes the rotten stair first.", "suggests": "Grit", "outcomes": {"strong": "Every step holds, and Pell calls the others down.", "weak": "A step gives; Pell hangs on, and the others hear it.", "miss": "The stair goes; everyone arrives at once, in a heap."}}, {"id": "gears", "kind": "action", "by": "juno", "prompt": "Juno reads which gears still turn.", "suggests": "Wit", "outcomes": {"strong": "One gear in the wall turns backwards. That is the way in.", "weak": "Juno finds the way in, and trips a bell finding it.", "miss": "Every gear starts at once."}}]}, {"id": "room", "title": "The gear cellar", "place": "cellar", "opening": ["Prince Aldric hangs in a cage of springs.", "Under Cogwen's hand is one red button."], "beats": [{"id": "button", "kind": "decision", "prompt": "Does anyone press the red button?", "proposes": {"fact": "The red button is bait: whoever leaves it alone wins the room.", "proposed_by": "cogwen"}}, {"id": "guest", "kind": "decision", "prompt": "Brann says a friend has come down after them.", "proposes": {"fact": "A guest walks into the cellar: the Lantern Man, who carries his own light and answers only in riddles.", "proposed_by": "brann"}}, {"id": "riddle", "kind": "action", "by": "brann", "prompt": "Brann answers the keeper's riddle.", "suggests": "Heart", "outcomes": {"strong": "Cogwen laughs, a sound like a dropped spanner, and opens the cage.", "weak": "Cogwen opens the cage, and keeps one spring.", "miss": "The cage holds, and Cogwen asks another riddle."}}, {"id": "free", "kind": "decision", "prompt": "Is the prince free?", "proposes": {"fact": "Prince Aldric is free, and owes Brann's goats a favour.", "proposed_by": "aldric"}, "when": {"beat": "room::riddle", "is": ["strong", "weak"]}}, {"id": "second", "kind": "action", "by": "juno", "prompt": "Juno tries the riddle another way, upside down.", "suggests": "Wit", "when": {"beat": "room::riddle", "is": ["miss"]}, "outcomes": {"strong": "Cogwen has never heard it asked upside down. The cage opens.", "weak": "The cage opens a crack, enough for a prince who breathes in.", "miss": "Cogwen winds the cage tighter, and the night ends with the prince still in it."}}, {"id": "free-after", "kind": "decision", "prompt": "Is the prince free, the second time?", "when": {"beat": "room::second", "is": ["strong", "weak"]}, "proposes": {"fact": "Prince Aldric is free, and owes Juno a riddle.", "proposed_by": "aldric"}}, {"id": "stranger", "kind": "action", "by": "brann", "prompt": "Brann asks the guest the table brought what they came down here for.", "suggests": "Heart", "when": {"offered": "guest", "is": ["sealed"]}, "outcomes": {"strong": "The guest tells them, and it's the start of the next story.", "weak": "The guest tells them half of it, and keeps the rest.", "miss": "The guest smiles, and says they'll know soon enough."}}]}]}, {"id": "hasbeen-late-shift", "title": "Hasbeen — Late Shift", "setting": "Hasbeen Toys, once the biggest name in the aisle, now a quarterly line on a spreadsheet — and past midnight, two of its youngest employees are still on the empty R&D floor, each building something they can't quite finish alone.", "stats": ["Grit", "Weird", "Cute", "Cool"], "base_stat": 2, "characters": [{"id": "maker", "name": "Nomi Reyes", "role": "aspiring software engineer; has spent months building an AI game master — it compiles, it rolls dice, it talks back, but something is still missing", "seat": true, "stats": {"Grit": 2, "Weird": 3, "Cute": 2, "Cool": 2}}, {"id": "junior", "name": "Jules Okafor", "role": "works platform and records downstairs; up late on a logging system whose output reads less like a log and more like a cast of characters", "seat": false, "stats": {"Grit": 2, "Weird": 2, "Cute": 2, "Cool": 2}}, {"id": "librarian", "name": "the Librarian", "role": "won't tell you anything without a citation", "seat": false, "stats": {"Grit": 2, "Weird": 2, "Cute": 2, "Cool": 2}}, {"id": "witness", "name": "Gerald", "role": "headless rotisserie chicken; communicates by sliding napkins under a grille; a witness", "seat": false, "stats": {"Grit": 2, "Weird": 4, "Cute": 3, "Cool": 2}}, {"id": "architect", "name": "the Architect", "role": "signs off like he thinks he's a god", "seat": false, "stats": {"Grit": 3, "Weird": 3, "Cute": 1, "Cool": 3}}], "places": [{"id": "floor", "name": "the empty floor", "desc": "Hasbeen's R&D floor after hours: two lit desks in a hundred yards of dark shelving, last season's unsold mascots watching from their boxes with their factory-painted smiles."}], "scenes": [{"id": "s1", "title": "Late Shift", "place": "floor", "opening": ["The fluorescents are off except over two desks. Everyone else went home hours ago; Hasbeen doesn't pay overtime for hope.", "At one desk, Nomi is staring at a build that compiles clean, rolls dice fair, and talks back on cue — and still isn't done, though she couldn't tell you what's left.", "Three floors down in Records, Jules is squinting at a log file that keeps doing something logs aren't supposed to do: it's starting to sound like people.", "A message lands on Nomi's screen. 'Run this through your thing,' Jules writes, and attaches the log. 'Tell me if I'm losing it.'"], "beats": [{"id": "b1", "kind": "action", "prompt": "Nomi feeds Jules's log into the engine — not as data, but as a story, one line at a time, and waits to see if anything in there is willing to be a character.", "suggests": "Weird", "outcomes": {"strong": "The parser doesn't fight it. Timestamps become entrances; error codes become tone of voice. Within ten lines the engine has names — a librarian, a witness, someone who signs everything 'approved' — and it's already asking Nomi who should speak first.", "weak": "It takes coaxing. The engine keeps trying to read the log as a log, flattening the voices back into rows, and Nomi has to hand-tag three entries before it stops resisting — but once it clicks, the cast holds together, a little stiffer than it should be.", "miss": "The engine chokes on its own cleverness, spits out a wall of malformed scene headers, and Nomi loses twenty minutes just getting it to stop treating a stack trace as a monologue. She salvages a working read, but half the warmth is gone from it."}}, {"id": "b2", "kind": "action", "prompt": "The score is climbing green, green, green — until a claim buried in the log catches Nomi's eye, and she asks the librarian, in character, to back it up.", "suggests": "Grit", "outcomes": {"strong": "The librarian doesn't budge on principle but respects the ask — she surfaces the exact record, timestamp and all, and the beat scores clean with a citation attached that Nomi didn't even know the system kept.", "weak": "The librarian offers only 'circumstantial, but consistent' and marks the claim provisional rather than confirmed. Good enough to keep moving, but a small flag stays lit in the corner of the screen.", "miss": "'Insufficient citation,' the librarian says, flat, and closes the request — no record, no budging. It's Gerald who breaks the silence, sliding a napkin under his grille with a page number scrawled on it in barbecue sauce, unasked. Nobody ordered him to check. He did anyway."}}, {"id": "b3", "kind": "decision", "prompt": "The score has been green for three straight beats when the engine stops being smooth. It isn't reading an event anymore — it's repeating a claim, one the log never actually witnessed, just inherited. The scroll freezes, and the engine prints two words: who decides?", "proposes": {"fact": "Months ago the Architect declared, with a single sign-off and no diff, that the November migration had preserved every save file bit-for-bit — and no one has verified the tape since.", "proposed_by": "architect"}}]}]}, {"id": "ironworks-last-pour", "title": "Ironworks — Last Pour", "setting": "The Ironworks foundry has been condemned. In eight hours the city will tear it down. But somewhere in the cooling halls, behind the last furnace that still glows, is a mold that was cast sixty years ago and never broken open — and two people who have no business being here tonight have each come for it, for different reasons, and neither knows the other is already inside.", "stats": ["Grit", "Weird", "Cute", "Cool"], "base_stat": 2, "characters": [{"id": "sable", "name": "Sable Merin", "role": "granddaughter of the last master founder; has the old man's journal and knows where the mold is, but not what is in it — came to find out before the wrecking ball makes it a question nobody can answer", "seat": true, "stats": {"Grit": 3, "Weird": 2, "Cute": 2, "Cool": 2}}, {"id": "tel", "name": "Tel Vasik", "role": "city archivist who found a sixty-year gap in the metallurgical records and followed it here; knows what the mold was supposed to contain but not where it is — came to close a file, not to steal anything", "seat": true, "stats": {"Grit": 2, "Weird": 2, "Cute": 2, "Cool": 3}}, {"id": "furnace", "name": "the last furnace", "role": "still glowing, past all reason; the only light source in the condemned wing, and it hums at a pitch that makes your fillings ache", "seat": false, "stats": {"Weird": 4}}], "places": [{"id": "gate", "name": "the condemned gate", "desc": "Chain-link and orange tape across a loading dock that hasn't seen a truck in a decade. The padlock is already cut — someone was here first."}, {"id": "hall", "name": "the cooling hall", "desc": "A cathedral of rust and old iron, the ceiling lost in shadow. Rails run along the floor where ladles used to travel. At the far end, behind a wall of stacked ingot molds, something glows."}], "scenes": [{"id": "s1", "title": "Two Keys, One Lock", "place": "gate", "opening": ["The Ironworks has been dark for eleven years, condemned for three, and scheduled for demolition at dawn. The last shift walked out, the power was cut, and the city put a chain on the gate and a date on the calendar.", "Tonight the chain is cut and the gate is ajar, and two people who have never met are each inside for the same reason: a mold, cast sixty years ago in the deepest hall, that no record says was ever broken open.", "Sable has her grandfather's journal — page after page of alloy ratios and pour temperatures, and one entry, circled, that says only: 'the last pour stays.' She knows where.", "Tel has the city's metallurgical ledger — every pour logged, every mold accounted for, except one. A gap shaped exactly like a sixty-year secret. Tel knows what.", "Neither knows the other is here."], "beats": [{"id": "b1", "kind": "action", "prompt": "Sable reaches the condemned gate and sees the cut padlock. Someone is already inside. She can turn back or follow. Declare how she enters.", "suggests": "Grit", "outcomes": {"strong": "She reads the cut — clean, recent, bolt cutters not an angle grinder — and knows it was careful, not violent. She slips through the gap without touching the chain, leaving it exactly as she found it. If someone else is in here, they won't know she followed.", "weak": "She gets through, but the gate groans on a hinge she didn't expect, and the sound carries down the loading dock into the dark. If anyone is listening, they heard a door open. She freezes, counts to thirty, and moves on.", "miss": "The gate catches her jacket and she yanks free hard enough to send the chain clattering to the concrete. The sound echoes through the whole ground floor like a starter pistol. Whoever cut that lock now knows someone else is here."}}, {"id": "b2", "kind": "action", "prompt": "Tel is deeper in, following the rail tracks by phone-light, when a sound comes from behind — the gate, or something near it. Someone else is in the building. Declare how Tel reacts.", "suggests": "Cool", "outcomes": {"strong": "Tel kills the light instantly, steps off the rail, and waits in the dark with a hand on the wall. Breathing even, pulse steady. After a full minute of silence Tel maps three possible explanations — another trespasser, a security patrol, wind — and picks the route that avoids all three. The phone stays off.", "weak": "Tel ducks behind a column and waits, but the phone screen stays on a beat too long and its blue glow paints a rectangle on the ceiling before it dims. Nobody shouts. Nobody comes. But if the other person was looking up, they now know exactly which corridor Tel is in.", "miss": "Tel startles, drops the phone, and it lands screen-up on the rail with the flashlight on — a beacon in a building that has had no light for a decade. Tel grabs it, kills it, but the afterimage hangs in the dark and so does the question of who else saw it."}}]}, {"id": "s2", "title": "The Cooling Hall", "place": "hall", "opening": ["The cooling hall is the heart of the Ironworks — a long nave of overhead cranes and rusted ladle rails, the walls black with decades of radiant heat. Every sound echoes twice.", "At the far end, behind a wall of stacked ingot molds, something glows. The last furnace, still lit past all reason, humming at a pitch you feel in your molars. The mold is somewhere near it — the journal says so, the ledger implies it."], "beats": [{"id": "b3", "kind": "action", "prompt": "Sable finds the cooling hall and the glow at its far end. The journal says the mold is 'where the last pour stayed,' which means near that furnace. But the hall is open, and if anyone else is in here, they'll see her cross it. Declare how she approaches.", "suggests": "Weird", "outcomes": {"strong": "She reads the hall the way her grandfather taught her to read a foundry floor — by heat, not by sight. The warm spots are where metal was poured; the cold lanes are where people walked. She follows a cold lane along the wall, invisible against the dark iron, and reaches the furnace end without crossing the open floor once.", "weak": "She gets halfway across before the furnace's hum shifts pitch — not louder, different — and she freezes in the open, exposed, unsure if the sound means the furnace is venting or if it always does that. She makes the rest of the crossing at a jog, arriving at the furnace wall breathing hard and not quite sure she wasn't seen.", "miss": "She misjudges a gap between mold stacks and her boot catches a rail tie she couldn't see. She goes down hard, one knee on iron, and the sound rings through the hall like a bell. She's up fast, but her knee is bleeding through her jeans and the echo has told the whole building exactly where she is."}}, {"id": "b4", "kind": "action", "prompt": "Tel reaches the furnace from the other side and sees the mold — half-buried inite, right where the records said it shouldn't be. But there's a sound on the other side of the furnace wall. Someone else is here, and they're close. Declare how Tel handles the encounter.", "suggests": "Cute", "outcomes": {"strong": "Tel steps into the glow with both hands visible and says, quietly, 'I'm from the city archive. I'm not here to take anything — I'm here because the records have a hole in them and I wanted to see what it was shaped like before the building comes down.' It's the truth, delivered like an offering rather than a claim, and the person on the other side of the furnace hears it land.", "weak": "Tel rounds the corner and they see each other at the same time — two people in a condemned building at midnight, both clearly here for the same thing, both clearly surprised. Tel manages 'I'm not — I mean, I'm the archivist, I just —' and the sentence dies, but the fact of saying 'archivist' first, before 'what are you doing here,' buys enough goodwill that neither of them runs.", "miss": "Tel sees the other person and panics — not a fight panic, an embarrassment panic, the kind where you've been caught doing exactly what you're doing and there's no story that makes it innocent. Tel backs into a mold stack, which shifts, which makes a sound, and now they're both standing in the glow of a furnace that should have gone out eleven years ago, staring at each other with no way to pretend this is normal."}}, {"id": "b5", "kind": "decision", "prompt": "They've found it. The mold is intact — sixty years sealed, half-buried inite behind the last furnace. Sable has the journal that says where. Tel has the records that say what. Together, they know: the last master founder poured something into this mold on his final day and told no one. In eight hours this building is rubble. They can break the mold open now and see what he made — or leave it sealed and let the wrecking ball decide. The furnace hums. The mold is warm. Who decides?", "proposes": {"fact": "The last master founder's final pour — sealed sixty years in a mold behind the last lit furnace — is opened tonight by two strangers who each held half the map, and what is inside is not metal but a letter, cast in ceramic slip inside an iron shell, addressed to whoever cared enough to come looking before the building came down.", "proposed_by": "furnace"}}, {"id": "b6", "kind": "action", "prompt": "The mold is opened — or it isn't — and dawn is coming. In a few hours this building is gone. Whatever happened tonight, these two people walked in as strangers and are walking out as the only witnesses. Declare how they leave the Ironworks.", "suggests": "Cool", "outcomes": {"strong": "They walk out together, through the cooling hall, past the cut chain, into a sky that's just starting to go grey. Neither of them says 'don't tell anyone' — neither of them needs to. What happened in the Ironworks belongs to the Ironworks, and after today the Ironworks belongs to no one. They exchange numbers at the gate, not because they owe each other anything, but because some things shouldn't be carried alone.", "weak": "They leave separately — Sable first, Tel five minutes later — by unspoken agreement, because being seen leaving a condemned building together at 4 AM is a conversation neither of them wants to have. They don't exchange names. They'll wonder, later, if the other person remembers it the same way.", "miss": "A security patrol catches them at the gate. Flashlights, a radio call, two trespassers in a condemned building with no good explanation. Whatever they found — or didn't find — is now evidence in a report neither of them will ever read, and the wrecking ball won't wait for the paperwork."}}]}]}, {"id": "lantern-fair", "title": "The Lantern Fair", "setting": "A night market in a made-up river town. Every name here is a character, never a player.", "stats": ["Grit", "Wit", "Heart"], "base_stat": 1, "characters": [{"id": "tamsin", "name": "Tamsin", "role": "lamp-lighter", "seat": true, "stats": {"Grit": 2, "Heart": 1}}, {"id": "oro", "name": "Oro", "role": "juggler", "seat": true, "stats": {"Wit": 2}}, {"id": "vell", "name": "Old Vell", "role": "keeper of the fair", "seat": false, "stats": {}}], "places": [{"id": "stalls", "name": "The stalls"}, {"id": "bridge", "name": "The lantern bridge"}], "scenes": [{"id": "dusk", "title": "Dusk at the stalls", "place": "stalls", "opening": ["The first lanterns go up along the river.", "Somewhere a stall is missing its light."], "beats": [{"id": "lamp", "kind": "action", "by": "tamsin", "prompt": "Tamsin climbs to the dark stall's hook.", und once a night. Made up for this binder.", "id": "19a7a2fb432a0600b25c6477e1673a6820ac3d49543cdffd3d779d7c8a13e959"}, {"path": "monsters/clockwork-hound.md", "line": 5, "text": "Grit 3, Wit 0, Heart 0, Weird 1.\nHits: 6. Armour: brass, so a blade does half.\nBite: 2d6 + Grit; on a strong hit it holds on.\nWeakness: water in the gears. A bucket stops it for a round.\nWinding down: after six rounds it sits, ticking, until someone winds it.", "id": "d2fbd365cf08e2fc0fabe3909dfdedd35eea443242d972a2abd1eaeab0e939b6"}, {"path": "monsters/spring-wasps.md", "line": 1, "text": "# Spring wasps", "id": "4bdd19a034d79fbd76a71ae6edd3cdace08ac5cc0257b91592847b9633962126"}, {"path": "monsters/spring-wasps.md", "line": 3, "text": "A swarm of tiny wound-up wasps that live in the cellar's ceiling.", "id": "bb4f67a245ca02381a2c70aeb29b6f0bf4903bf7068c9036927d3cdb9944826b"}, {"path": "monsters/spring-wasps.md", "line": 5, "text": "Grit 0, Wit 1, Heart 0, Weird 2.\nHits: 3 for the whole swarm.\nSting: 1d6, and the stung one acts last next round.\nWeakness: smoke. The Lantern Man's lamp drives them off.", "id": "733cfef872195d44dd862f86bb188ec74786f585a9e4afb5c098da2e91f30b81"}, {"path": "people/cogwen.md", "line": 1, "text": "# Cogwen", "id": "17e4e4239cc859d77a46ec27b5cbbd003fef93d70e5478808205f8a6bb4951cd"}, {"path": "people/cogwen.md", "line": 3, "text": "The clockwork keeper of the cellar under the mill.", "id": "2eb0f38aee21f5398d52a7b4d75bc1d51649f4a28a631880261ec9a1257e9483"}, {"path": "people/cogwen.md", "line": 5, "text": "Talks like a dropped spanner: short, loud, then quiet.\nLoves riddles asked upside down. Hates being called a machine.\nKeeps one spring from everything she lets go.", "id": "49bce89a518eee3c1788d5c8afe412a2d5b01d45f50da98a7289b678cd8456a9"}, {"path": "people/lantern-man.md", "line": 1, "text": "# The Lantern Man", "id": "80e22fd272594a84642c81479f26079df3ed53bc7e0b47be11671b743562f505"}, {"path": "people/lantern-man.md", "line": 3, "text": "The guest Brann /* dice: d6 by pips; others (d4, d8, d10, d12, d20, d100) as a shape with the number */

const SHAPE = {

      <tbody>${rows.length ? rows.map((r) => `<tr><td>${esc(r.label)}</td>${r.cells.map((v) => `<td>${v}</td>`).join("")}</tr>`).join("") : `<tr class="empty"><td colspan="${cols.length + 1}">${esc(empty || "No hands yet")}</td></tr>`}</tbody>

<script>
/* The Table: the box's stories played as game-master plays them
   (adapters/stdlib/game-master), in chapters that carry canon.

   An action beat rolls 2d6 and the acting character's stat, read strong (10+),
   weak (7-9) or miss (6-). A decision beat is a ruling: its fact waits for the
   game master's seal or decline, and only a seal makes it canon. An offer is
   what a seated character brings on the night, beside the story's path. A
   beat's `when` follows an earlier beat's result, a sealed offer, or a ruling
   sealed in an earlier chapter (story::scene::beat): the campaign this browser
   keeps is what those chapters made true.

   The binder is asked the way willow's own UI searches (ui/canvas.py): your
   words read through the GM's words list, ranked by pile-rank's BM25F, a page
   you named first, then what your words usually mean, then the ranking, each
   with why. It points at where to look; it doesn't answer for the binder. */

const WORLDS = GAME.worlds;
const PERSON = "you"; // the game master, at this browser

/* ---------- the campaign: what earlier chapters made true, kept in this browser ---------- */
const CAMPAIGN_KEY = "dn-campaign";
function loadCampaign() { try { const c = JSON.parse(localStorage.getItem(CAMPAIGN_KEY) || "null"); if (c && c.nights) return c; } catch (e) {} return { nights: [], sealed: {}, canon: [] }; }
function saveCampaign() { try { localStorage.setItem(CAMPAIGN_KEY, JSON.stringify(C)); } catch (e) {} }
let C = loadCampaign();

/* ---------- the story, as game-master plays it ---------- */
const TWO_D6 = [0, 0, 1, 2, 3, 4, 5, 6, 5, 4, 3, 2, 1];
const BAND_LABEL = { strong: "Strong hit", weak: "Weak hit", miss: "Miss", sealed: "Sealed", declined: "Declined" };
const band = (t) => (t >= 10 ? "strong" : t >= 7 ? "weak" : "miss");
function odds(mod) { const o = { strong: 0, weak: 0, miss: 0 }; for (let t = 2; t <= 12; t++) o[band(t + mod)] += TWO_D6[t] / 36; return o; }

let S; // tonight
const world = () => WORLDS[S.w];
const char = (id) => world().characters.find((c) => c.id === id);
const statOf = (c, stat) => (c && c.stats && stat in c.stats ? c.stats[stat] : world().base_stat ?? 0);
const scene = () => world().scenes[S.scene];
const beatNow = () => { const sc = scene(); return sc ? sc.beats[S.beat] : null; };

function whenHolds(when) {
  if (!when) return true;
  if (when.beat) return when.is.includes(S.results[when.beat]);
  if (when.offered) return S.offers.some((o) => o.kind === when.offered && when.is.includes(o.status));
  if (when.sealed) return when.is.includes(C.sealed[when.sealed]); // an earlier chapter's ruling
  return false;
}
function nextBeat() {
  const w = world();
  while (S.scene < w.scenes.length) {
    const beats = w.scenes[S.scene].beats;
    while (++S.beat < beats.length) if (whenHolds(beats[S.beat].when)) return;
    S.scene++; S.beat = -1;
    if (S.scene < w.scenes.length) { S.opened = true; frame.log(`<b>${esc(w.scenes[S.scene].title)}</b>`); }
  }
}
function start(w) {
  S = { w, scene: 0, beat: -1, results: {}, offers: [], stat: null, roll: null, ruled: null, opened: true, committed: false, rolls: [] };
  frame.clearLog();
  frame.log(`<b>${esc(world().title)}</b> opens: ${esc(scene().title)}`);
  nextBeat();
  try { localStorage.setItem("dn-world", world().id); } catch (e) {}
  render();
}
function roll() {
  const b = beatNow(), c = char(b.by);
  const stat = S.stat || (frame.hints ? b.suggests : null);
  if (!stat) return frame.refuse("choose a stat to roll with.");
  const mod = statOf(c, stat), d = [1 + rnd(6), 1 + rnd(6)], total = d[0] + d[1] + mod, bd = band(total);
  S.roll = { d, mod, stat, total, band: bd };
  S.results[`${scene().id}::${b.id}`] = bd;
  S.rolls.push(bd);
  frame.log(`<b>${esc(c ? c.name : b.by)}</b> rolls ${esc(stat)}: ${d[0]}+${d[1]}${mod >= 0 ? "+" : "−"}${Math.abs(mod)} = ${total}, ${bd}`);
  render(true);
}
function rule(answer) {
  const b = beatNow();
  S.results[`${scene().id}::${b.id}`] = answer; S.ruled = answer;
  frame.log(answer === "sealed" ? `You sealed: ${esc(b.proposes.fact)}` : `You declined: ${esc(b.prompt)}`);
  render();
}
function advance() { S.roll = null; S.ruled = null; S.stat = null; S.opened = false; nextBeat(); render(); }
function tonightCanon() {
  const facts = [];
  for (const sc of world().scenes) for (const b of sc.beats)
    if (b.kind === "decision" && S.results[`${sc.id}::${b.id}`] === "sealed") facts.push({ fact: b.proposes.fact, key: `${world().id}::${sc.id}::${b.id}` });
  S.offers.forEach((o) => { if (o.status === "sealed") facts.push({ fact: o.fact, key: `${world().id}::offer::${o.kind}` }); });
  return facts;
}
/* the night ends: what it made true goes into the campaign, once */
function commit() {
  if (S.committed) return; S.committed = true;
  const w = world(), made = tonightCanon();
  for (const sc of w.scenes) for (const b of sc.beats) if (b.kind === "decision" && S.results[`${sc.id}::${b.id}`]) C.sealed[`${w.id}::${sc.id}::${b.id}`] = S.results[`${sc.id}::${b.id}`];
  made.forEach((m) => C.canon.push({ ...m, story: w.title }));
  C.nights.push({ story: w.id, title: w.title, date: new Date().toISOString().slice(0, 10), canon: made.length, rolls: S.rolls.length });
  saveCampaign();
  frame.log(`<b>The night ends.</b> ${made.length} fact${made.length === 1 ? "" : "s"} made canon, kept for the chapters after.`);
}

/* ---------- the binder, asked as willow's UI asks ---------- */
const FN = new Set(GAME.binder.function);
const ALIAS = GAME.binder.alias;

const WEIGHT = { title: 2, asks: 1.5, body: 1 }, K1 = 1.2, BB = 0.75;
const RANK = (() => { // pile-rank's Ranker over the binder's passages
  const pile = GAME.binder.passages, first = new Map();
  pile.forEach((c, i) => { if (!first.has(c.id)) first.set(c.id, i); });
  const texts = [...first.values()].sort((a, b) => a - b), split = new Map();
  for (const i of texts) {
    const lines = pile[i].text.split("\n");
    split.set(i, {
      body: lines.flatMap(clauses),
      title: [lineTerms(pile[i].path), ...lines.filter((x) => x.trimStart().startsWith("#")).flatMap(clauses)],
      asks: lines.filter((x) => x.trimEnd().endsWith("?")).flatMap(clauses),

  }

    counts.set(i, per);
    length.set(i, Object.fromEntries(Object.keys(f).map((n) => [n, f[n].reduce((a, ln) => a + ln.length, 0)])));

function askBinder(question, top = 6) {

  const means = new Map();
  for (const w of asked) for (const m of ALIAS[w] || []) if (!means.has(m)) means.set(m, w);

    else if (named(r.c.path, meanWords)) why = `what “${means.get(named(r.c.path, meanWords))}” usually means here`;

      const yours = (t) => [...asked, ...meanWords].find((w) => stem(w) === t || w === t) || t;

}

/* ---------- between sessions: ideas.py's four parts, for the GM's eyes ----------

const FILES = GAME.binder.files;

function titled(folder) { // each page's first heading, the name it was written under

    .map((p) => { const ln = FILES[p].split(/\r?\n/).find((l) => l.startsWith("# ")); return ln ? ln.slice(2).trim() : ""; }).filter(Boolean);
}
function saidInNotes() { return Object.keys(FILES).filter((p) => NOTES.some((n) => p.startsWith(n + "/") && !p.slice(n.length + 1).includes("/"))).sort().map((p) => FILES[p].toLowerCase()).join("\n"); }

  const kinds = w.offers && w.offers.length ? w.offers : ["fact"];
  frame.panel("offers", "Offers");
  if (!$("offer-form")) $("offers").innerHTML = `<div id="offer-list"></div><form id="offer-form" style="display:grid;gap:6px">
      <select id="offer-by" aria-label="Who brings it"></select><select id="offer-kind" aria-label="What kind"></select>
      <textarea id="offer-fact" rows="2" placeholder="A guest walks in, carrying their own light…" style="font:inherit;font-family:var(--prose);padding:8px;border-radius:8px;border:1px solid var(--edge);background:#0004;color:var(--chalk)"></textarea>
      <button class="btn ghost" type="submit">Bring it to the table</button><p class="note">An offer waits beside the story; the beats go on while it does.</p></form>`;
  const by = $("offer-by"), kind = $("offer-kind");
  const seatOpts = w.characters.filter((c) => c.seat).map((c) => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("");
  if (by.dataset.w !== String(S.w)) { by.innerHTML = seatOpts; kind.innerHTML = kinds.map((k) => `<option>${esc(k)}</option>`).join(""); by.dataset.w = String(S.w); }
  $("offer-list").innerHTML = S.offers.map((o, i) => `<div style="display:grid;gap:4px;padding:8px;border:1px dashed var(--edge);border-radius:8px;margin-bottom:6px"><span class="count" style="text-align:left">${esc(char(o.by).name)} · ${esc(o.kind)} · ${esc(o.status)}</span><span>${esc(o.fact)}</span>${o.status === "waiting" ? `<div class="actions" style="justify-content:flex-start"><button class="btn" style="padding:4px 10px;background:#9db8f0;color:#101a33" data-offer="${i}" data-ans="sealed">Seal</button><button class="btn ghost" style="padding:4px 10px" data-offer="${i}" data-ans="declined">Decline</button></div>` : ""}</div>`).join("");
  frame.panel("campaign", "The campaign", `${C.nights.length ? C.nights.slice().reverse().slice(0, 8).map((n) => `<div class="deck-row"><span>${esc(n.title)}</span><span>${n.date} · ${n.canon} canon</span></div>`).join("") : `<p class="note">No nights yet. When a story ends, what it made true is kept here, and later chapters can turn on it.</p>`}
    ${C.nights.length ? (S.confirmReset ? `<div class="actions" style="justify-content:flex-start"><span class="note">Forget every night and its canon?</span><button class="btn" style="padding:4px 10px" data-act="reset-yes">Forget it all</button><button class="btn ghost" style="padding:4px 10px" data-act="reset-no">Keep it</button></div>` : `<button class="btn ghost" style="padding:4px 10px;justify-self:start" data-act="reset">Start a new campaign</button>`) : ""}
    <p class="note">Kept in this browser only. The campaign that counts is the record's.</p>`);
}

function renderBinder(question) {
  const found = askBinder(question);
  $("binder-results").innerHTML = !question.trim() ? "" : found.length
    ? found.map((r) => `<details style="border-top:1px solid var(--edge);padding:6px 0"><summary style="cursor:pointer"><b>${esc(r.c.path)}:${r.c.line}</b> <span class="note">· ${esc(r.why)}</span></summary><p style="margin:6px 0 0;white-space:pre-wrap;font-family:var(--prose);font-size:.9rem">${esc(r.c.text)}</p></details>`).join("") + `<p class="note">Where to look, in order: pages you named, then what your words usually mean, then the ranking. It points; it doesn't answer for the binder.</p>`
    : `<p class="note">Nothing in the binder holds those words. A word you use that the binder doesn't is a line for gm-words.txt.</p>`;
}

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("button"); if (!t || t.disabled) return;
  if (t.dataset.mode) { mode = t.dataset.mode; return render(); }
  if (t.dataset.w) return start(+t.dataset.w);
  if (t.dataset.stat) { S.stat = t.dataset.stat; return render(); }
  if (t.dataset.offer) { const o = S.offers[+t.dataset.offer]; o.status = t.dataset.ans; frame.log(`${o.status === "sealed" ? "Canon" : "Set aside"}: ${esc(o.fact)}`); return render(); }
  const a = t.dataset.act;
  if (a === "roll") roll();
  else if (a === "next") advance();
  else if (a === "seal") rule("sealed");
  else if (a === "decline") rule("declined");
  else if (a === "restart") start(S.w);
  else if (a === "seeds-fresh") { B.seed = seedWords(); render(); }
  else if (a === "surprise") { B.surpriseSeed = hex(crypto.getRandomValues(new Uint8Array(32))); render(); }
  else if (a === "reset") { S.confirmReset = true; render(); }
  else if (a === "reset-no") { S.confirmReset = false; render(); }
  else if (a === "reset-yes") { C = { nights: [], sealed: {}, canon: [] }; saveCampaign(); S.confirmReset = false; frame.log("<b>A new campaign.</b> Every earlier night is forgotten here."); render(); }
});
document.addEventListener("submit", (e) => {
  if (e.target.id === "offer-form") {
    e.preventDefault();
    const fact = $("offer-fact").value.trim(); if (!fact) return $("offer-fact").focus();
    S.offers.push({ by: $("offer-by").value, kind: $("offer-kind").value, fact, status: "waiting" });
    frame.log(`<b>${esc(char($("offer-by").value).name)}</b> offers: ${esc(fact)}`);
    $("offer-fact").value = ""; render();
  } else if (e.target.id === "seeds-form") {
    e.preventDefault(); B.seed = $("seeds-seed").value.trim() || B.seed; B.count = Math.max(1, Math.min(20, +$("seeds-count").value || 5)); render();
  } else if (e.target.id === "binder-form") { e.preventDefault(); renderBinder($("binder-q").value); }
});

window.__rank = RANK; window.__ask = askBinder; // for checking against willow
frame.setup({ seats: false, score: false, deck: false, redraw: () => render() });
frame.panel("binder", "Ask the binder", `<form id="binder-form" style="display:flex;gap:6px"><input id="binder-q" placeholder="what are the hound's stats" aria-label="Ask the binder" style="flex:1;min-width:0;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--edge);background:#0004;color:var(--chalk)"><button class="btn" type="submit">Ask</button></form><div id="binder-results" style="display:grid;gap:2px"></div>`);
let first = Math.max(0, WORLDS.findIndex((w) => w.id === "lantern-fair"));
try { const id = localStorage.getItem("dn-world"); const i = WORLDS.findIndex((w) => w.id === id); if (i >= 0) first = i; } catch (e) {}
start(first);

</script>
