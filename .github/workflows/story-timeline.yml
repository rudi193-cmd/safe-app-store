name: story-timeline

on:
  push:
    paths:
      - "apps/story-timeline/**"
      - "tests/story-timeline/**"
      - ".github/workflows/story-timeline.yml"
  pull_request:
    paths:
      - "apps/story-timeline/**"
      - "tests/story-timeline/**"
      - ".github/workflows/story-timeline.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/story-timeline/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e libs/vault-paths       # shared vault-rooted path resolver (A5)
          pip install -e libs/safe-integration   # Protocol-based SAFE session/intake/identity (P0)
          pip install -e libs/mcp-connect         # shared MCP stdio client (P1)
          pip install -e libs/storage-backend     # SOIL storage Protocol (P2)
          pip install -r apps/story-timeline/requirements.txt
          pip install pytest

      - name: Compile
        run: python -m compileall -q apps/story-timeline

      - name: Pytest
        run: pytest -q tests/story-timeline/
