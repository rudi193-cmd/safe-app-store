name: store

# Store-wide CI — the gates every push earns, regardless of which app changed.
# Per-app workflows (ask-jeles, private-ledger, source-trail, story-timeline)
# stay path-filtered and OS-matrixed; this workflow is the whole-store floor:
#
#   catalog     — catalog.json and apps/ agree (tools/catalog_lint.py --strict)
#   vault-clean — no app leaks user data to fixed paths (tools/vault_leak_lint.py --strict)
#   compile     — every .py in the repo byte-compiles
#   app-tests   — test suites with no dedicated workflow, one matrix leg per app
#   bureau-differential
#               — bureau ships a JS port of its Python engine. Its differential
#                 is guarded with skipUnless(node), and a skipped test still
#                 exits 0, so the Python-only app-tests leg passes it by
#                 skipping. This job runs it under Node and fails if it skipped.
#   browser-resolver
#               — marching-arts ships a second implementation of its
#                 authorization resolver, in TypeScript on SQLite-WASM. This job
#                 is what holds it to the Python core: it regenerates the
#                 differential reference from marching_arts/ at this commit and
#                 fails if the two disagree anywhere. Runs under Node, on the
#                 in-memory VFS.
#   browser-mechanisms
#               — the same app's four browser-only mechanisms, in a real
#                 Chromium: the opfs-sahpool VFS persisting across a reload, the
#                 Web Locks election, the pauseVfs()/unpauseVfs() handoff, and
#                 SharedWorker uniqueness. None of them are reachable from Node,
#                 so browser-resolver says nothing about any of them. Separate
#                 job because it needs a browser and browser-resolver must stay
#                 runnable without one.

on:
  push:
    # Both names: the fleet is split between `main` and `master`, and a
    # single-name filter turns a default-branch rename into a silently dead
    # push trigger. Same hedge dependabot-automerge.yml already carries.
    branches: [main, master]
  pull_request:
  schedule:
    # Daily drift catcher, off the :00/:30 peak-load minutes — willow-mcp's
    # pattern. Most of the 22 apps go untouched for weeks; a dependency point
    # release or runner-image change should not wait for the next push.
    - cron: "47 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Catalog gate
        run: python tools/catalog_lint.py --strict

      - name: Vault-clean gate
        run: python tools/vault_leak_lint.py --strict

      - name: Compile sweep
        run: python -m compileall -q apps libs stores tools scripts research tui.py store_mcp.py _shot.py

      - name: Drift-guards
        # Stdlib-only source scanners (no app deps): no app reads the shared
        # SOIL store raw (B3), and no app builds schema DDL/DML by string
        # interpolation. Named explicitly so tests/story-timeline/ (an app
        # suite with its own deps) isn't collected here.
        #
        # test_tier_vocabulary.py is the store refit's P0 gate
        # (docs/store_refit_plan.md): CLAUDE.md and stores/README.md must
        # keep naming the lower tier the same way ("playground") and keep
        # stating, verbatim, that stores/{major}/stored/ holds a keeping
        # record rather than a second copy of the code.
        #
        # test_p1_keeping_records.py unit-tests catalog_lint.py's
        # lint_records() (P1's gate) against a synthetic repo, proving each
        # check — coverage, duplicates, majors, relation/anchor, location,
        # state — can actually catch its violation. The "Catalog gate" step
        # above only proves the real repo is currently clean; this proves the
        # checks aren't vacuous.
        #
        # test_promote_check_record.py is P2's gate: promote_check.py --record
        # must write stores/{major}/promoted/<app_id>.json only for a candidate
        # that passed every gate *and* was verified by a hand other than its
        # author (§0.2), and must leave stores/ byte-identical on every
        # refusal. Nothing else in the repo exercises --record — no promotion
        # record has been minted yet — so without this step the entire write
        # path would ship having never run anywhere.
        #
        # test_p3_generated_catalog_fields.py is P3's gate: a catalog entry's
        # tier/majors/status must agree with what stores/ actually holds, so
        # the catalog stops being hand-authorable for those fields.
        #
        # test_catalog_location.py guards P3's other half: the real catalog
        # lives at .willow/store/catalog.json now: the root catalog.json is a
        # pointer, and must never grow back into a second copy of the data.
        #
        # test_status_vocabulary_migration.py: status is now the state enum
        # (seeded/building/gated/stalled/archived), not the old shop
        # vocabulary (stable/beta/coming_soon). Covers the base lint() checks
        # test_p3_generated_catalog_fields.py doesn't reach on its own: the
        # old vocabulary is actually rejected, and the manifest-required
        # tiers moved with it (seeded warns, everything else errors).
        #
        # test_catalog_top_level_keys.py is P4's gate: catalog.json's
        # top-level keys are a closed set (version/store/description/apps),
        # now that discovery_sources moved to docs/discovery_sources.md.
        # Proves an unknown key — discovery_sources growing back, or any
        # other new organ — actually fails instead of passing silently.
        #
        # test_loose_repos.py resolves one of docs/store_refit_plan.md's
        # "Open gates": a catalog entry naming a repository but no local
        # path (code the house can't reach, like grove/willow-grove) must
        # be named in stores/pending.json with a reason, same as an
        # unresolved apps/ build.
        #
        # test_fleet_decisions.py guards stores/decisions/fleet.json — the
        # fleet decision record (N9's boot chokepoint, store side): the real
        # record is clean AND each covenant check catches a synthetic
        # violation (reason required both ways, verified_by ≠ author,
        # reopen_when written-not-omitted, superseded rows leave the
        # standing law). Same proves-not-vacuous pattern as
        # test_p1_keeping_records.py.
        #
        # test_sap_gate / test_seam / test_session / test_principal /
        # test_quota are The Forge's store-side half (PR #161, D3-D6/D11):
        # the signed-manifest gate, the seam that enforces it, store-minted
        # sessions, builder identity, and per-builder quota. They landed
        # with 165 passing tests and nothing running them — this step names
        # its files explicitly, so a new suite is invisible to CI until it
        # is listed here. These are trust-boundary modules; CLAUDE.md §7
        # states their behaviour as law ("signed -> allowed, tampered ->
        # denied"), which is exactly the claim that should not rest on a
        # local run recorded in a PR body.
        #
        # tests/test_checkpoint_memory.py is deliberately NOT listed: it
        # imports Nestor, which is not on PyPI, and stores/requirements.txt
        # keeps that line commented out until a SHA is pinned at promotion
        # (D12/D13). Listing it here would fail collection on every run.
        # It goes in the moment the pin lands.
        #
        # tests/test_decisions_boot_nestor.py IS listed, unlike the file
        # above, because it never imports the real `nestor` package —
        # tools/decisions_boot.py's Nestor MCP cross-check (stores/decisions/
        # README.md, "Consulting Nestor") shells out to a `nestor` on PATH as
        # a subprocess, and this suite exercises that against a tiny
        # stdlib-only fake server it writes to tmp_path, never a real
        # install. A test that isn't named here doesn't run in CI at all —
        # this file's own house history is the reason that's spelled out
        # rather than assumed (docs/the-house-already-knew.md).
        #
        # pip install -r stores/requirements.txt: stores/sap_gate.py needs
        # real asymmetric signing, so `pip install pytest` alone no longer
        # collects. The Nestor line in that file is commented out, so this
        # resolves to cryptography and nothing else.
        #
        # test_readiness_corpus.py / test_readiness_drift.py are the Forge's
        # readiness seam (stores/readiness_corpus.py, tools/readiness_drift.py):
        # the panel's coverage measured against an EXTERNAL control corpus, and
        # the drift guard over the bearing tables. Listed here so the seam's
        # UNIT tests run on every push — they build tmp corpora and need no
        # external repo (their live tests skip when no corpus is injected, which
        # is the default in this job). The seam run against the REAL corpus is a
        # separate scheduled job (readiness-drift, below), because that one does
        # need the corpus repo checked out. Neither imports fsrs or Nestor, so
        # both collect under the cryptography-only install above.
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r stores/requirements.txt
          python -m pytest tests/test_no_raw_soil_reads.py tests/test_no_fstring_schema_sql.py tests/test_no_inline_vault_root.py tests/test_no_unauthenticated_bind.py tests/test_promote_check.py tests/test_promote_check_record.py tests/test_vault_lint_vacuous_scan.py tests/test_tier_vocabulary.py tests/test_p1_keeping_records.py tests/test_p3_generated_catalog_fields.py tests/test_catalog_location.py tests/test_status_vocabulary_migration.py tests/test_catalog_top_level_keys.py tests/test_loose_repos.py tests/test_fleet_decisions.py tests/test_decisions_boot_nestor.py tests/test_sap_gate.py tests/test_seam.py tests/test_session.py tests/test_principal.py tests/test_quota.py tests/test_readiness_corpus.py tests/test_readiness_drift.py -q

  app-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [ai-game-master, aristarchus, bureau, civics-check, field-acoustics,
              homestead-health, intake-desk,
              law-gazelle, marching-arts, playgate, terpsi-chat, the-squirrel,
              utety-chat]
        include:
          # utety-chat's TUI tests boot the real Textual app; textual is an
          # optional runtime dep (the server runs without it), so it lives
          # here, not in the app's requirements.txt.
          - app: utety-chat
            test-deps: textual
          # playgate writes its disposition log as a hash chain with stdlib
          # hashlib and has Nestor walk it (apps/playgate/playgate/audit.py).
          # The verifier is injected, so `serve` runs without it — which is
          # exactly why it has to be installed HERE: the chain tests are
          # importorskip'd, and a skipped test still exits 0. Same trap
          # bureau-differential exists to close, one job down.
          # require-nestor makes those tests fail rather than skip.
          - app: playgate
            test-deps: git+https://github.com/rudi193-cmd/Nestor@v0.2.0
            require-nestor: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/${{ matrix.app }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e libs/vault-paths      # shared vault-rooted path resolver (A5)
          pip install -e libs/pg-sqlite-shim   # shared SQLite->Postgres shim (A5, law-gazelle)
          pip install -e libs/subject-consent  # third-party consent axis (intake-desk)
          pip install -r apps/${{ matrix.app }}/requirements.txt
          pip install pytest ${{ matrix.test-deps }}

      - name: Run tests
        working-directory: apps/${{ matrix.app }}
        env:
          # Empty for every leg but playgate's, where it turns the chain
          # tests from "skip if Nestor is absent" into "fail if Nestor is
          # absent" — so this leg cannot go green having verified nothing.
          PLAYGATE_REQUIRE_NESTOR: ${{ matrix.require-nestor }}
        run: python -m pytest tests/ -q

  # bureau's browser port, held to its Python core by a differential. Same
  # reason as browser-resolver below for being its own job: the app-tests matrix
  # is Python-only and this needs Node.
  #
  # The matrix leg above DOES run tests/test_differential.py, and it passes
  # there — by skipping, because the tests are guarded with
  # skipUnless(shutil.which("node")). A skipped test still exits 0, so that leg
  # reports green having compared nothing. This job is what makes the 16,000
  # comparisons real, and it asserts they happened rather than trusting the
  # exit code.
  bureau-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # No pip install and no cache: bureau is stdlib-only and has no
          # requirements to resolve.

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          # No npm cache: there is no package.json. tools/diff_runner.js is
          # handed a script generated in Python and run verbatim.

      - name: Differential against the Python core
        working-directory: apps/bureau
        run: |
          set -eo pipefail
          node --version
          python -m pip install --upgrade pip >/dev/null
          pip install pytest
          python -m pytest tests/test_differential.py -q -rs | tee "$RUNNER_TEMP/bureau-diff.txt"
          if grep -qi "skipped" "$RUNNER_TEMP/bureau-diff.txt"; then
            echo "::error::the differential skipped in the job that exists to run it"
            exit 1
          fi

  # game-lab ships reference simulators, not a pytest suite, so it is not in
  # the app-tests matrix (that matrix runs `pytest tests/` and game-lab has no
  # tests/ dir — adding it there would be a leg that errors on a missing
  # directory, not a gate). This job is its gate instead: sims/ci_smoke.py runs
  # the eleven stdlib added-game engines under both policies at low N and fails
  # if any is missing its run() seam, raises, or returns a malformed result. It
  # is not a baseline reproduction (unseeded counts wobble; that is
  # run_added_games.py's job) — it is "do the sims still run and still return
  # measured shape."
  #
  # requirements.txt names python-chess, the one real dependency (the core-five
  # path: baseline_core.py, chess_selfplay.py). It is installed here so
  # ci_smoke.py's core-five checks are real rather than skipped — a gate that
  # skips its dependency-bearing checks and exits 0 is the failure this store
  # keeps naming. If the install breaks, this job goes red, which is honest.
  #
  # What this job does NOT check, said plainly (the store's "say what your
  # harness structurally cannot see" rule): baseline_core.py gets a real import
  # check, but chess_selfplay.py is a script whose whole body runs at import
  # (it plays 13 games and writes a hardcoded /root/_chess_res.md), so it gets
  # a compile/syntax check only — its runtime and that hardcoded path are not
  # exercised here.
  game-lab-sims:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/game-lab/requirements.txt

      - name: Install the one real dependency (python-chess, core-five path)
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/game-lab/requirements.txt

      - name: The gate can fail — prove it catches its own breakage
        working-directory: apps/game-lab/sims
        run: python ci_smoke.py --self-test

      - name: Sims run and return measured shape (11 engines x 2 policies + import checks)
        working-directory: apps/game-lab/sims
        run: python ci_smoke.py

  # marching-arts' browser port, held to the Python core by a differential.
  # Separate from the app-tests matrix because that matrix is Python-only and
  # this leg needs Node; folding it in would have meant a Node setup step every
  # other app pays for and none of them use.
  browser-resolver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # No pip install: test/gen_reference.py is stdlib-only, deliberately,
          # so the reference can always be produced wherever the core can run.

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"          # >=22: @sqlite.org/sqlite-wasm requires it
          cache: npm
          cache-dependency-path: apps/marching-arts/browser/package-lock.json

      - name: Install
        working-directory: apps/marching-arts/browser
        env:
          # This job runs nothing in a browser. playwright is a devDependency for
          # the browser-mechanisms job; without this its postinstall would pull a
          # ~150 MB Chromium into a job that never launches one.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Build
        working-directory: apps/marching-arts/browser
        run: npm run build

      - name: Differential against the Python core
        working-directory: apps/marching-arts/browser
        # `npm test` regenerates test/reference.json from marching_arts/ in this
        # checkout on every run, then runs the gate, the owner protocol and the
        # differential. Do not pin the generator to a fixed --rev to keep this
        # green: a reference generated from a revision the core has moved past
        # agrees with the port forever, which converts the gate into a
        # decoration. A red job here means the core moved and the port did not,
        # and that is the finding, not the failure.
        run: npm test

      - name: Mutation test
        working-directory: apps/marching-arts/browser
        # A gate that cannot fail is not a gate. Breaks the port five ways and
        # requires each to be caught.
        run: npm run test:mutation

  # The four things browser-resolver structurally cannot check, in a browser.
  #
  # Its own job rather than two more steps on browser-resolver, for one reason:
  # browser-resolver needs Node and a stdlib Python and nothing else, and that is
  # worth keeping. This job needs a ~150 MB Chromium download and a display-less
  # sandbox, and a flaky browser install should not be able to take the
  # differential red with it. Both are in `test`'s needs:, so neither can be
  # skipped without branch protection noticing.
  browser-mechanisms:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"          # >=22: @sqlite.org/sqlite-wasm requires it
          cache: npm
          cache-dependency-path: apps/marching-arts/browser/package-lock.json

      - name: Install
        working-directory: apps/marching-arts/browser
        env:
          # The browser is installed by the next step, from the pinned
          # playwright, rather than by npm's postinstall.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Install Chromium
        working-directory: apps/marching-arts/browser
        # Chromium only: the mechanisms under test are Chromium-shaped
        # (opfs-sahpool needs createSyncAccessHandle, which is DedicatedWorker-
        # only, and the SharedWorker findings in README.md are engine-specific).
        # Firefox and WebKit would need their own expectations, not the same
        # ones run three times.
        run: npx playwright install --with-deps chromium

      - name: Build
        working-directory: apps/marching-arts/browser
        run: npm run build

      - name: Browser mechanisms
        working-directory: apps/marching-arts/browser
        # opfs-sahpool persistence across a reload, the Web Locks election, the
        # pauseVfs()/unpauseVfs() handoff, SharedWorker uniqueness. Serves the
        # package over http://127.0.0.1 — a secure context, so no TLS needed,
        # and OPFS is present.
        run: npm run test:browser

      - name: Browser mutation test
        working-directory: apps/marching-arts/browser
        # Breaks each of the four on purpose and requires the block that targets
        # it to go red. Without this the job above is a suite, not a gate.
        run: npm run test:browser:mutation

  # The Forge's app-side half. Its own job rather than an app-tests matrix
  # leg, for two reasons the generic leg cannot express:
  #
  #   1. src/ layout. app-tests runs `pytest tests/` from the app directory
  #      with only `pip install -r requirements.txt`; the_forge lives under
  #      src/ and is not importable that way. This job installs the package.
  #   2. kartikeya decides how much of the suite is real. The D2 sandbox
  #      runner and D6 mount-policy tests are guarded with skipUnless(kart),
  #      and a skipped test still exits 0 — the same trap bureau-differential
  #      exists to close. Without Kart: 83 passed, 2 skipped. With it: 186
  #      passed. The 103-test difference is the isolation boundary itself,
  #      which is the whole reason this code is in the trust boundary.
  #
  # bubblewrap is deliberately NOT installed here yet. bwrap on the runner
  # un-skips one further test and turns two others red: test_workdir_is_honoured
  # (the build lands in /root instead of its requested workdir under bwrap
  # isolation) and test_sandbox_config_is_scoped_to_the_call. Those look like
  # real defects in sandbox_runner.py, not CI setup, and installing bwrap here
  # before they are fixed would land a red gate. Add the install step in the
  # same change that fixes them — that is the point at which CI starts
  # testing real isolation rather than the plain fallback path.
  forge-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/the-forge/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e apps/the-forge
          pip install -r apps/the-forge/requirements.txt
          pip install pytest

      - name: Run tests
        working-directory: apps/the-forge
        run: python -m pytest tests/ -q

      - name: Assert Kart-gated tests actually ran
        # The point of the job. If kartikeya ever fails to install, the suite
        # still exits 0 with the D2/D6 tests skipped, and this job would report
        # green having tested no isolation at all.
        working-directory: apps/the-forge
        run: |
          set -eo pipefail
          python -c "import kartikeya"
          python -m pytest tests/test_sandbox_runner.py tests/test_mount_policy.py -q -rs | tee /tmp/forge.txt
          if grep -q "kartikeya is a real dependency" /tmp/forge.txt; then
            echo "::error::D2/D6 tests skipped — kartikeya missing, isolation untested"
            exit 1
          fi

  # Upstream-drift canary for the Forge's readiness seam. The seam pins a
  # small set of hand-authored bearings to specific control IDs in an EXTERNAL
  # corpus (rudi193-cmd/production-readiness-checklist) that re-syncs upstream;
  # if a control is renumbered or retired, a bearing silently points at
  # nothing. tools/readiness_drift.py catches that — but only against the real
  # corpus, which lives in a separate repo, so it needs a second checkout.
  #
  # Scheduled + manual ONLY (never push/PR): drift is an UPSTREAM event, so
  # gating a PR on it would let another repo's edit turn this repo's merges
  # red. Deliberately NOT in the `test` aggregate's `needs` for the same
  # reason — and because a job that skips on push would skip the aggregate
  # with it (a skipped required check breaks branch protection). This is a
  # canary that goes red on the daily run when upstream drifts, not a gate.
  #
  # The corpus repo is public (verified), so the default GITHUB_TOKEN checks
  # it out with no secret. `contents: read` (the workflow default) suffices.
  # `--strict` is fail-closed: a drifted ID exits non-zero and reddens the run.
  readiness-drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          path: safe-app-store
      - uses: actions/checkout@v7
        with:
          repository: rudi193-cmd/production-readiness-checklist
          path: production-readiness-checklist
      - name: Readiness bearing-drift guard
        # Stdlib-only (readiness_corpus.py is stdlib at import; the tool
        # spec-loads it), so no Python setup or pip install is needed.
        run: |
          cd safe-app-store
          python3 tools/readiness_drift.py \
            --corpus ../production-readiness-checklist --strict

  # Aggregate gate: branch protection requires a single check named "test"
  # across the whole fleet. Green only when every gate and app suite is.
  # readiness-drift is intentionally absent: it is a scheduled canary, not a
  # merge gate, and it does not run on push/PR at all (see its comment above).
  test:
    needs: [gates, app-tests, forge-tests, browser-resolver, browser-mechanisms]
    runs-on: ubuntu-latest
    steps:
      - run: echo "gates, all app suites, The Forge, the browser resolver and the browser mechanisms green"
