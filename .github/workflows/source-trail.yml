name: source-trail

on:
  push:
    paths:
      - "apps/source-trail/**"
      - ".github/workflows/source-trail.yml"
  pull_request:
    paths:
      - "apps/source-trail/**"
      - ".github/workflows/source-trail.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/source-trail/pyproject.toml

      - name: Install package
        working-directory: apps/source-trail
        run: |
          python -m pip install --upgrade pip
          pip install -e ../../libs/willow-pg   # shared Postgres seam (A5)
          pip install -e .

      - name: Compile
        run: python -m compileall -q apps/source-trail/source_trail

      - name: Import smoke
        run: |
          python -c "import source_trail; import source_trail.app"
          python -c "import sources_db; import personas"
        working-directory: apps/source-trail
